<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050B1D" />
  <title>Akses AppVibe Vault</title>
  <meta name="description" content="Masuk ke AppVibe Vault Anda melalui WhatsApp." />
  <link rel="canonical" href="https://appvibe.biz.id/access/" />
  <link rel="icon" href="/favicon.webp" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{--navy:#050b1d;--blue:#126bff;--cyan:#10dcd5;--bg:#eef3fa;--surface:#fff;--line:#c9d4e5;--text:#10203f;--muted:#66748d;--muted-light:#8491a8;--success:#16866d;--danger:#a0392c;--radius-xl:28px;--radius-lg:18px;--shadow:0 22px 60px rgba(8,30,77,0.11)}
    html{min-width:320px;background:var(--bg)}
    body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;background:radial-gradient(circle at 8% 0%,rgba(18,107,255,0.08),transparent 24%),radial-gradient(circle at 92% 9%,rgba(16,220,213,0.07),transparent 24%),var(--bg)}
    button,input{font:inherit}
    button{cursor:pointer}
    a{color:inherit}

    .ac-header{position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(201,212,229,.78);background:rgba(255,255,255,.88);backdrop-filter:blur(18px)}
    .ac-header-inner{display:flex;align-items:center;justify-content:space-between;width:min(960px,calc(100% - 32px));min-height:64px;margin:0 auto;gap:16px}
    .ac-header-brand{display:inline-flex;align-items:center;text-decoration:none;font-weight:800;font-size:1rem;color:var(--navy)}
    .ac-header-back{color:var(--blue);font-size:12px;font-weight:800;text-decoration:none}
    .ac-header-back:hover{text-decoration:underline}

    .ac-wrapper{width:min(720px,calc(100% - 32px));margin:0 auto;padding:42px 0 72px}
    .ac-card{border:1px solid rgba(201,212,229,.95);border-radius:var(--radius-xl);background:rgba(255,255,255,.94);box-shadow:var(--shadow);padding:clamp(24px,4vw,42px)}
    .ac-card h1{margin:0 0 8px;color:var(--navy);font-family:'Space Grotesk','Plus Jakarta Sans',sans-serif;font-size:clamp(26px,4vw,40px);letter-spacing:-.065em;line-height:1.02}
    .ac-card>p{margin:0 0 24px;color:var(--muted);font-size:13px;line-height:1.7}

    .ac-field{display:flex;gap:10px;margin-bottom:20px}
    .ac-field input{flex:1;min-height:50px;outline:none;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);background:#fbfdff;font-size:15px;font-weight:600;transition:border-color .18s ease,box-shadow .18s ease}
    .ac-field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(18,107,255,.11)}
    .ac-field button{flex:none;min-height:50px;border:0;border-radius:14px;padding:12px 22px;color:#fff;background:var(--blue);font-weight:800;font-size:13px;transition:background .14s ease}
    .ac-field button:hover{background:#2579ff}
    .ac-field button:disabled{opacity:.5;cursor:not-allowed}

    .ac-status{display:none;margin:0 0 20px;border-radius:12px;padding:12px 14px;font-size:12px;font-weight:600;line-height:1.45}
    .ac-status.show{display:block}
    .ac-status.error{border:1px solid #ffcfc6;color:var(--danger);background:#fff0ed}
    .ac-status.success{border:1px solid #b8eee9;color:#1f5f68;background:#ebfbfa}
    .ac-status.info{border:1px solid #d5e2fa;color:var(--muted);background:#edf4ff}
    .ac-status.loading{color:var(--muted);text-align:center}

    .ac-note{margin-top:16px;font-size:11px;color:var(--muted-light);line-height:1.6}

    .ac-loader{display:none;text-align:center;padding:40px 0}
    .ac-loader.show{display:block}
    .ac-spinner{width:32px;height:32px;margin:0 auto 12px;border:3px solid #cddcf5;border-top-color:var(--blue);border-radius:50%;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Dashboard (logged-in) */
    .ac-dash-section{margin-bottom:24px}
    .ac-dash-section:last-child{margin-bottom:0}
    .ac-dash-label{color:var(--muted-light);font:700 9px/1 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .ac-access-tag{display:inline-block;padding:6px 14px;border-radius:999px;font:700 11px/1 'DM Mono',monospace;color:#116c59;background:#e5f8f2;margin-bottom:8px}
    .ac-bundle-list{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
    .ac-bundle-item{padding:6px 12px;border:1px solid var(--line);border-radius:10px;font-size:11px;font-weight:600;color:#3c4f6b}
    .ac-app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;list-style:none;padding:0;margin:0}
    .ac-app-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:11px;font-weight:700;color:#3c4f6b}
    .ac-app-mark{display:grid;width:22px;height:22px;place-items:center;border:1px solid #cbd8ee;border-radius:7px;color:var(--blue);background:#f3f7ff;font:700 10px/1 'Space Grotesk',sans-serif;flex:none}
    .ac-order{border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;margin-bottom:12px}
    .ac-order:last-child{margin-bottom:0}
    .ac-order-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
    .ac-order-head h3{margin:0;font-size:14px;letter-spacing:-.02em}
    .ac-badge{display:inline-flex;padding:5px 10px;border-radius:999px;font:700 9px/1 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.3px}
    .ac-badge.paid,.ac-badge.delivered{color:#116c59;background:#e5f8f2}
    .ac-badge.pending{color:#8b7500;background:#fff8e0}
    .ac-detail-row{display:flex;gap:16px;margin:8px 0;font-size:11px;color:var(--muted)}
    .ac-detail-row strong{color:var(--text)}
    .ac-logout{margin-top:24px;display:block;width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 22px;background:transparent;font-weight:700;font-size:13px;color:var(--muted);transition:border-color .14s ease,color .14s ease}
    .ac-logout:hover{border-color:var(--danger);color:var(--danger)}

    @media(max-width:600px){
      .ac-field{flex-direction:column}
      .ac-wrapper{padding-top:22px;padding-bottom:42px}
    }
  </style>
</head>
<body>
  <header class="ac-header">
    <div class="ac-header-inner">
      <a class="ac-header-brand" href="/">AppVibe</a>
      <a class="ac-header-back" href="/">&larr; Kembali</a>
    </div>
  </header>

  <main class="ac-wrapper">
    <div class="ac-card" id="acCard">
      <!-- JS renders the login or dashboard here -->
    </div>
  </main>

  <script type="module">
    const card = document.getElementById('acCard');
    const APP_NAMES = {
      adsprint:'ADSprint', pikat:'PIKAT', rupa:'RUPA', mula:'MULA',
      arah:'ARAH', cetak:'CETAK', adegan:'ADEGAN', suara:'SUARA',
      bukti:'BUKTI', mimik:'MIMIK', ritme:'RITME', tayang:'TAYANG',
      katalog:'KATALOG',
    };
    const PACK_LABELS = {
      advertiser:'Advertiser App Pack', commerce:'Commerce & Marketplace Pack',
      creator:'Creator & Affiliate Pack', brand_launch:'Brand & Launch Pack',
      vault_full:'Full AppVibe Vault',
    };

    const COOLDOWN_SEC = 60;
    let cooldownTimer = null;

    function formatPrice(a){ return 'Rp'+Number(a||0).toLocaleString('id-ID'); }
    function formatDate(s){ if(!s)return'-'; return new Date(s).toLocaleDateString('id-ID',{year:'numeric',month:'short',day:'numeric'}); }

    // ──── Login view ────
    function renderLogin(){
      card.innerHTML = `
        <h1>Akses AppVibe Vault</h1>
        <p>Masukkan nomor WhatsApp yang Anda gunakan saat checkout. Tautan akses akan dikirim ke WhatsApp tersebut.</p>
        <div class="ac-field">
          <input type="tel" id="acPhone" placeholder="08xxxxxxxxxx" autocomplete="tel" inputmode="tel" />
          <button id="acSend">Kirim Tautan Akses</button>
        </div>
        <div class="ac-status" id="acStatus" role="alert"></div>
        <div class="ac-note">Tautan berlaku selama 15 menit dan hanya dapat digunakan satu kali. Pastikan nomor WhatsApp yang dimasukkan sama dengan yang tercatat saat pembelian.</div>
      `;
      const phoneInput = document.getElementById('acPhone');
      const sendBtn = document.getElementById('acSend');
      const statusEl = document.getElementById('acStatus');

      sendBtn.addEventListener('click', () => handleSend(phoneInput, sendBtn, statusEl));
      phoneInput.addEventListener('keydown', (e) => { if(e.key==='Enter') sendBtn.click(); });
    }

    function setStatus(el, type, msg){
      el.className = 'ac-status show ' + type;
      el.textContent = msg;
    }

    async function handleSend(input, btn, statusEl){
      const phone = input.value.trim();
      if(!phone || phone.length < 8){
        setStatus(statusEl, 'error', 'Masukkan nomor WhatsApp yang valid.');
        input.focus();
        return;
      }
      btn.disabled = true;
      setStatus(statusEl, 'loading', 'Mengirim…');

      try {
        const res = await fetch('/api/auth/request-magic-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone }),
        });
        const data = await res.json().catch(() => ({}));
        setStatus(statusEl, 'success', data.message || 'Jika nomor terdaftar, tautan akses telah dikirim melalui WhatsApp.');
        startCooldown(btn, statusEl);
      } catch {
        setStatus(statusEl, 'error', 'Koneksi bermasalah. Silakan coba lagi.');
        btn.disabled = false;
      }
    }

    function startCooldown(btn, statusEl){
      let remaining = COOLDOWN_SEC;
      btn.textContent = `Kirim ulang (${remaining}s)`;
      cooldownTimer = setInterval(() => {
        remaining--;
        if(remaining <= 0){
          clearInterval(cooldownTimer);
          btn.disabled = false;
          btn.textContent = 'Kirim Tautan Akses';
          return;
        }
        btn.textContent = `Kirim ulang (${remaining}s)`;
      }, 1000);
    }

    // ──── Dashboard view ────
    function renderDashboard(data){
      const { member_name, has_full_vault, bundle_ids, app_ids, orders } = data;

      const accessTag = has_full_vault
        ? '<span class="ac-access-tag">Full Vault — Semua Akses</span>'
        : (bundle_ids.length > 0
          ? bundle_ids.map(b => `<span class="ac-access-tag">${PACK_LABELS[b]||b}</span>`).join(' ')
          : '<span class="ac-access-tag" style="color:var(--muted);background:#edf4ff">Belum ada akses aktif</span>');

      const bundlesHtml = bundle_ids.length > 0
        ? `<div class="ac-dash-section"><div class="ac-dash-label">Bundle Aktif</div><ul class="ac-bundle-list">${bundle_ids.map(b=>`<li class="ac-bundle-item">${PACK_LABELS[b]||b}</li>`).join('')}</ul></div>`
        : '';

      const appsHtml = app_ids.length > 0
        ? `<div class="ac-dash-section"><div class="ac-dash-label">Aplikasi Terbuka (${app_ids.length})</div><ul class="ac-app-grid">${app_ids.map(id=>{
            const name = APP_NAMES[id]||id;
            const icon = name.slice(0,1);
            return `<li class="ac-app-item"><span class="ac-app-mark">${icon}</span>${name}</li>`;
          }).join('')}</ul></div>`
        : '';

      const ordersHtml = orders.length > 0
        ? `<div class="ac-dash-section"><div class="ac-dash-label">Riwayat Pembelian</div>${orders.map(o=>{
            const badge = o.payment_status === 'paid' || o.fulfillment_status === 'delivered' ? 'paid' : o.payment_status;
            const label = PACK_LABELS[o.pack_id] || o.pack_id;
            return `<div class="ac-order"><div class="ac-order-head"><h3>${label}</h3><span class="ac-badge ${badge}">${badge}</span></span></div><div class="ac-detail-row"><span>${formatPrice(o.amount)}</span><span>${formatDate(o.created_at)}</span><span>${o.paid_at?'Dibayar '+formatDate(o.paid_at):''}</span></div></div>`;
          }).join('')}</div>`
        : '';

      card.innerHTML = `
        <h1>Halo, ${esc(member_name)}</h1>
        <p>Berikut ringkasan akses AppVibe Vault Anda.</p>
        ${accessTag}
        ${bundlesHtml}
        ${appsHtml}
        ${ordersHtml}
        <button class="ac-logout" id="acLogout">Keluar</button>
      `;
      document.getElementById('acLogout').addEventListener('click', handleLogout);
    }

    async function handleLogout(){
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch {}
      renderLogin();
    }

    function esc(s){ const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }

    // ──── Init: check session ────
    async function init(){
      card.innerHTML = '<div class="ac-loader show"><div class="ac-spinner"></div><p style="color:var(--muted);font-size:12px;margin:0">Memeriksa sesi…</p></div>';
      try {
        const res = await fetch('/api/member/me');
        if(res.ok){
          const data = await res.json();
          renderDashboard(data);
          return;
        }
      } catch {}
      renderLogin();
    }

    init();
  </script>
</body>
</html>
