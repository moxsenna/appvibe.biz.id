<body>
  <noscript>
      --muted-2:#a8abb2;
      --lime:#d8ff42;
      --lime-deep:#b7dc20;
      --red:#ff5e4d;
      --blue:#7094ff;
      --gold:#ffc85b;
      --mint:#7ee1bd;
      --shadow:0 24px 70px rgba(6,8,13,.17);
      --soft-shadow:0 10px 32px rgba(14,18,27,.08);
      --r-xl:34px;
      --r-lg:24px;
      --r-md:16px;
      --pill:999px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
      min-width:320px;
      overflow-x:hidden;
    }
    body:before{
      content:"";
      pointer-events:none;
      position:fixed;
      z-index:-2;
      inset:0;
      opacity:.52;
      background-image:
        linear-gradient(rgba(13,15,19,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(13,15,19,.055) 1px, transparent 1px);
      background-size:36px 36px;
      mask-image:linear-gradient(to bottom,black 0%, transparent 70%);
    }
    body:after{
      content:"";
      pointer-events:none;
      position:fixed;
      z-index:-1;
      inset:0;
      background:
        radial-gradient(circle at 9% 3%,rgba(216,255,66,.20),transparent 19%),
        radial-gradient(circle at 92% 16%,rgba(112,148,255,.14),transparent 24%),
        radial-gradient(circle at 85% 92%,rgba(255,94,77,.10),transparent 28%);
    }

    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    ::selection{background:var(--lime);color:var(--ink)}

    .wrap{max-width:1460px;margin:0 auto;padding:18px}
    .topbar{
      position:sticky;top:12px;z-index:50;
      display:flex;justify-content:space-between;align-items:center;gap:18px;
      padding:12px 14px 12px 20px;
      background:rgba(13,15,19,.93);
      color:#fff;
      border:1px solid rgba(255,255,255,.1);
      border-radius:var(--pill);
      box-shadow:0 16px 42px rgba(0,0,0,.18);
      backdrop-filter:blur(18px);
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-mark{
      position:relative;width:44px;height:44px;display:grid;place-items:center;
      overflow:hidden;flex:none;border-radius:14px;background:var(--lime);color:var(--ink);
      font:700 22px/1 "Playfair Display",Georgia,serif;
      box-shadow:inset 0 -4px 0 rgba(0,0,0,.14);
    }
    .brand-mark:after{
      content:"";position:absolute;inset:8px;border:1px solid rgba(13,15,19,.34);border-radius:9px;transform:rotate(45deg)
    }
    .brand-copy strong{display:block;font-size:15px;letter-spacing:-.4px;white-space:nowrap}
    .brand-copy span{display:block;margin-top:4px;color:#b4b7c0;font:500 9px/1 "DM Mono",monospace;letter-spacing:1.25px;text-transform:uppercase;white-space:nowrap}
    .nav{display:flex;align-items:center;gap:2px}
    .nav a{font-size:11px;font-weight:700;color:#bec1ca;padding:10px 12px;border-radius:var(--pill);transition:.18s}
    .nav a:hover{background:rgba(255,255,255,.08);color:#fff}
    .header-actions{display:flex;align-items:center;gap:9px;flex:none}
    .status{
      display:flex;align-items:center;gap:7px;color:#c8cbd3;font:500 9px/1 "DM Mono",monospace;
      letter-spacing:.5px;white-space:nowrap;padding:9px 11px;border:1px solid rgba(255,255,255,.13);border-radius:var(--pill)
    }
    .status i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(216,255,66,.12)}
    .menu-btn{display:none}

    .btn{
      border:1px solid transparent;border-radius:13px;padding:12px 15px;font-size:11px;font-weight:800;line-height:1;
      display:inline-flex;justify-content:center;align-items:center;gap:8px;transition:all .18s ease;
    }
    .btn:hover:not(:disabled){transform:translateY(-2px)}
    .btn:active:not(:disabled){transform:translateY(1px)}
    .btn.lime{background:var(--lime);color:#182008;box-shadow:0 5px 0 var(--lime-deep)}
    .btn.lime:hover{box-shadow:0 7px 0 var(--lime-deep)}
    .btn.paper{background:var(--white);color:var(--ink);border-color:var(--line);box-shadow:0 2px 7px rgba(0,0,0,.04)}
    .btn.paper:hover{border-color:#abb0a3}
    .btn.ghost{color:#d6d8dd;border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.04)}
    .btn.ghost:hover{background:rgba(255,255,255,.1)}
    .btn.dark{background:var(--ink);color:#fff;box-shadow:0 5px 0 #000}
    .btn.small{padding:9px 11px;font-size:10px;border-radius:10px}
    .btn.full{width:100%}

    .hero{
      position:relative;overflow:hidden;margin-top:18px;min-height:610px;padding:52px;
      border-radius:var(--r-xl);
      background:linear-gradient(126deg,#0d1015 0%,#141824 56%,#232b45 100%);
      color:#fff;box-shadow:var(--shadow);
      display:grid;grid-template-columns:minmax(0,1.1fr) minmax(350px,.9fr);align-items:center;gap:30px;
    }
    .hero:before{
      content:"";position:absolute;width:590px;height:590px;border-radius:50%;right:-200px;top:-255px;
      border:1px dashed rgba(216,255,66,.42);
      box-shadow:0 0 0 52px rgba(216,255,66,.04),0 0 0 110px rgba(112,148,255,.06);
    }
    .hero:after{
      content:"";position:absolute;left:-120px;bottom:-190px;width:400px;height:400px;border-radius:50%;
      background:rgba(255,94,77,.14);filter:blur(3px)
    }
    .hero-copy{position:relative;z-index:1;max-width:790px}
    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--pill);
      color:#e4ff90;background:rgba(216,255,66,.10);border:1px solid rgba(216,255,66,.24);
      font:500 10px/1 "DM Mono",monospace;letter-spacing:1.1px;text-transform:uppercase;
    }
    .eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px rgba(216,255,66,.8)}
    .hero h1{
      margin:21px 0 18px;max-width:810px;font:600 clamp(44px,6vw,82px)/.91 "Playfair Display",Georgia,serif;
      letter-spacing:-3.6px;
    }
    .hero h1 em{font-style:italic;color:var(--lime)}
    .hero p{max-width:650px;margin:0;color:#c3c6cf;font-size:15px;line-height:1.8}
    .hero-actions{display:flex;align-items:center;flex-wrap:wrap;gap:11px;margin-top:31px}
    .hero-micro{display:flex;align-items:flex-start;gap:10px;margin-top:28px;max-width:590px;color:#a4a8b4;font-size:11px;line-height:1.58}
    .hero-micro b{color:#f4f6fb}
    .micro-icon{width:29px;height:29px;flex:none;border:1px solid rgba(216,255,66,.32);border-radius:10px;display:grid;place-items:center;color:var(--lime);font-weight:900}
    .hero-visual{position:relative;z-index:1;min-height:440px;display:grid;place-items:center}
    .vault-card{
      position:relative;width:min(426px,100%);min-height:390px;padding:20px;
      border:1px solid rgba(255,255,255,.2);border-radius:25px;
      background:linear-gradient(150deg,rgba(41,47,70,.94),rgba(19,23,33,.98));
      box-shadow:20px 22px 0 rgba(112,148,255,.16),inset 0 1px 0 rgba(255,255,255,.12);
      transform:rotate(2deg);
      overflow:hidden;
    }
    .vault-card:before{
      content:"";position:absolute;inset:0;background-image:
      linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px;opacity:.7
    }
    .vault-card > *{position:relative;z-index:1}
    .vault-top{display:flex;align-items:center;justify-content:space-between;font:500 9px/1 "DM Mono",monospace;letter-spacing:1px;text-transform:uppercase;color:#aeb4c4}
    .vault-top b{color:#f3ffbb;font-weight:500}
    .vault-word{
      margin:34px 0 21px;font:600 44px/.92 "Playfair Display",Georgia,serif;letter-spacing:-1.6px;color:#fff
    }
    .vault-word em{font-style:italic;color:var(--lime)}
    .vault-divider{height:1px;background:rgba(255,255,255,.13);margin:18px 0}
    .vault-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .vault-box{padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.045)}
    .vault-box span{display:block;color:#96a1b7;font:500 8px/1 "DM Mono",monospace;letter-spacing:.8px;text-transform:uppercase}
    .vault-box b{display:block;margin-top:8px;font-size:12px;line-height:1.35;color:#fff}
    .vault-sticker{
      position:absolute;right:17px;bottom:17px;padding:10px 11px;max-width:190px;border-radius:11px;
      background:var(--lime);color:var(--ink);font:700 10px/1.36 "DM Mono",monospace;transform:rotate(-4deg);box-shadow:4px 5px 0 rgba(0,0,0,.3)
    }

    .proof-strip{
      margin:17px 0 0;padding:11px 18px;border:1px solid var(--line);border-radius:var(--pill);background:rgba(255,253,248,.7);
      display:flex;gap:14px;align-items:center;justify-content:space-between;overflow:auto;
    }
    .proof-strip::-webkit-scrollbar{height:0}
    .proof-strip > span{white-space:nowrap;color:#73776f;font:500 10px/1 "DM Mono",monospace;letter-spacing:.3px}
    .proof-strip > span b{color:var(--ink);font-weight:800}
    .proof-divider{width:1px;height:17px;background:var(--line);flex:none}

    /* Product preview marquee — lightweight live CSS miniatures, not 13 embedded apps */
    .product-gallery{padding:54px 0 0;overflow:hidden}
    .gallery-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin:0 0 16px}
    .gallery-intro h2{margin:8px 0 0;font:600 clamp(30px,3.8vw,48px)/.98 "Playfair Display",Georgia,serif;letter-spacing:-1.5px}
    .gallery-intro h2 em{font-style:italic;color:#405cb7}
    .gallery-intro p{max-width:460px;margin:0;color:var(--muted);font-size:12px;line-height:1.65}
    .gallery-eyebrow{color:#5f6f34;font:600 10px/1 "DM Mono",monospace;letter-spacing:1.15px;text-transform:uppercase}
    .gallery-viewport{position:relative;overflow:hidden;padding:8px 0}
    .gallery-viewport:before,.gallery-viewport:after{content:"";position:absolute;z-index:2;top:0;bottom:0;width:92px;pointer-events:none}
    .gallery-viewport:before{left:0;background:linear-gradient(90deg,var(--paper),rgba(246,244,238,0))}
    .gallery-viewport:after{right:0;background:linear-gradient(270deg,var(--paper),rgba(246,244,238,0))}
    .gallery-track{display:flex;width:max-content;gap:12px;will-change:transform}
    .gallery-track.left{animation:gallery-left 62s linear infinite}
    .gallery-track.right{animation:gallery-right 70s linear infinite}
    .gallery-viewport:hover .gallery-track,.gallery-viewport:focus-within .gallery-track{animation-play-state:paused}
    @keyframes gallery-left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    @keyframes gallery-right{from{transform:translateX(-50%)}to{transform:translateX(0)}}
    .preview-card{
      --p-bg:#122820;--p-panel:#244a3c;--p-ink:#fffdf8;--p-soft:#b9e4cf;--p-accent:#f6cc63;--p-line:rgba(255,255,255,.18);
      position:relative;width:246px;flex:none;padding:9px;border:1px solid var(--line);border-radius:19px;background:var(--white);text-align:left;
      box-shadow:0 8px 18px rgba(13,15,19,.06);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    }
    .preview-card:hover{transform:translateY(-3px);border-color:#aeb5a7;box-shadow:0 14px 26px rgba(13,15,19,.11)}
    .preview-card:focus-visible{outline:3px solid rgba(112,148,255,.45);outline-offset:3px}
    .preview-window{position:relative;overflow:hidden;height:137px;padding:9px;border-radius:13px;background:var(--p-bg);color:var(--p-ink)}
    .preview-window:before{content:"";position:absolute;inset:0;opacity:.21;background-image:linear-gradient(var(--p-line) 1px,transparent 1px),linear-gradient(90deg,var(--p-line) 1px,transparent 1px);background-size:17px 17px}
    .preview-window > *{position:relative;z-index:1}
    .preview-top{display:flex;justify-content:space-between;align-items:center;font:500 6px/1 "DM Mono",monospace;letter-spacing:.75px;text-transform:uppercase;color:var(--p-soft)}
    .preview-top i{display:block;width:7px;height:7px;border-radius:2px;background:var(--p-accent)}
    .preview-hero{margin-top:18px;display:grid;grid-template-columns:1fr 59px;gap:8px;align-items:end}
    .preview-title{font:700 19px/.9 "Playfair Display",Georgia,serif;letter-spacing:-.8px;color:var(--p-ink)}
    .preview-title em{color:var(--p-accent);font-style:italic}
    .preview-title.small{font-size:16px;line-height:.94}
    .preview-side{height:51px;border:1px solid var(--p-line);border-radius:10px;background:var(--p-panel)}
    .preview-lines{display:grid;gap:5px;margin-top:10px}
    .preview-lines span{display:block;height:4px;border-radius:999px;background:var(--p-soft);opacity:.83}
    .preview-lines span:nth-child(1){width:83%}.preview-lines span:nth-child(2){width:60%;background:var(--p-accent)}.preview-lines span:nth-child(3){width:72%}
    .preview-chips{display:flex;gap:5px;margin-top:12px}.preview-chips span{display:block;width:28px;height:12px;border:1px solid var(--p-line);border-radius:5px;background:rgba(255,255,255,.06)}
    .preview-meta{padding:10px 4px 3px}.preview-meta b{display:block;font-size:12px;letter-spacing:-.25px}.preview-meta span{display:block;margin-top:4px;color:#6d7480;font-size:9px;line-height:1.3}
    .p-adsprint{--p-bg:#10231f;--p-panel:#1d4b3d;--p-ink:#fffef9;--p-soft:#b9e4cf;--p-accent:#f6cc63}
    .p-pikat{--p-bg:#4f46e5;--p-panel:#7c3aed;--p-ink:#fff;--p-soft:#fbcfe8;--p-accent:#f8b7df}
    .p-rupa{--p-bg:#1d43ff;--p-panel:#ff6b3d;--p-ink:#fff;--p-soft:#dfff35;--p-accent:#dfff35}
    .p-mula{--p-bg:#1c2126;--p-panel:#9d475b;--p-ink:#fcfaf5;--p-soft:#dbe4d2;--p-accent:#edae49}
    .p-arah{--p-bg:#132235;--p-panel:#2556d9;--p-ink:#fffdf7;--p-soft:#bcd6ef;--p-accent:#e8b84b}
    .p-cetak{--p-bg:#2855d7;--p-panel:#e84d3d;--p-ink:#fffdf8;--p-soft:#dce6ff;--p-accent:#ffc945}
    .p-adegan{--p-bg:#121212;--p-panel:#282621;--p-ink:#f4efe2;--p-soft:#d9a441;--p-accent:#d95f3d}
    .p-suara{--p-bg:#121416;--p-panel:#303639;--p-ink:#f5f8f7;--p-soft:#41d7d7;--p-accent:#ff9d47}
    .p-bukti{--p-bg:#13242b;--p-panel:#28536b;--p-ink:#fffdf8;--p-soft:#dce9df;--p-accent:#dfb750}
    .p-mimik{--p-bg:#17213a;--p-panel:#3156c9;--p-ink:#fffdf8;--p-soft:#dce5ff;--p-accent:#c99d54}
    .p-ritme{--p-bg:#15212b;--p-panel:#2658d8;--p-ink:#fffef9;--p-soft:#b9d9cf;--p-accent:#f3d46c}
    .p-tayang{--p-bg:#102a43;--p-panel:#21a6d6;--p-ink:#fff;--p-soft:#dff5fc;--p-accent:#ef7f4d}
    .p-katalog{--p-bg:#17211f;--p-panel:#165dff;--p-ink:#fffdf8;--p-soft:#dceee5;--p-accent:#ffd83e}

    .section{padding:94px 0 0}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:23px}
    .section-kicker{color:#5f6f34;font:600 10px/1 "DM Mono",monospace;letter-spacing:1.15px;text-transform:uppercase}
    .section h2{margin:10px 0 0;max-width:740px;font:600 clamp(36px,4.4vw,60px)/.97 "Playfair Display",Georgia,serif;letter-spacing:-2px}
    .section h2 em{font-style:italic;color:#405cb7}
    .section-copy{max-width:420px;margin:0;color:var(--muted);font-size:12px;line-height:1.7}
    .section-tag{
      flex:none;padding:10px 12px;border:1px solid #b7cc68;border-radius:var(--pill);background:#eff8ca;
      color:#4d6213;font:600 9px/1 "DM Mono",monospace;letter-spacing:.7px;white-space:nowrap
    }

    .pain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .pain{
      min-height:230px;padding:22px;border:1px solid var(--line);border-radius:var(--r-lg);background:rgba(255,253,248,.85);
      box-shadow:var(--soft-shadow);
    }
    .pain:nth-child(2){background:linear-gradient(145deg,#eef4ff,#e1eaff)}
    .pain:nth-child(3){background:linear-gradient(145deg,#fff3ed,#ffe1d8)}
    .pain-index{font:500 10px/1 "DM Mono",monospace;color:#7f867b;letter-spacing:1px}
    .pain-icon{width:44px;height:44px;margin:19px 0 15px;border-radius:14px;background:#fff;display:grid;place-items:center;border:1px solid var(--line);font-size:19px}
    .pain h3{margin:0;font-size:17px;letter-spacing:-.35px}
    .pain p{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.65}

    .three-steps{
      display:grid;grid-template-columns:.9fr 1.2fr .9fr;gap:14px;align-items:stretch
    }
    .step-card{
      min-height:280px;padding:24px;border:1px solid var(--line);border-radius:var(--r-lg);
      background:rgba(255,253,248,.82);box-shadow:var(--soft-shadow);display:flex;flex-direction:column
    }
    .step-card.featured{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:13px 14px 0 rgba(112,148,255,.18)}
    .step-no{font:500 10px/1 "DM Mono",monospace;letter-spacing:1px;color:#7281a8}
    .step-card:not(.featured) .step-no{color:#57721a}
    .step-card h3{margin:23px 0 10px;font:600 30px/1 "Playfair Display",Georgia,serif;letter-spacing:-.7px}
    .step-card p{margin:0;font-size:12px;line-height:1.7;color:#697078}
    .step-card.featured p{color:#bbc0ca}
    .step-chip{display:inline-flex;align-items:center;align-self:flex-start;gap:7px;margin-top:auto;padding:9px 10px;border-radius:10px;font:600 9px/1 "DM Mono",monospace}
    .step-card:not(.featured) .step-chip{background:#eff8ca;color:#4e6514;border:1px solid #c9df75}
    .step-card.featured .step-chip{background:rgba(216,255,66,.12);border:1px solid rgba(216,255,66,.28);color:#e4ff8d}
    .step-chip i{display:block;width:7px;height:7px;border-radius:50%;background:currentColor}

    .packs{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
    .pack{
      position:relative;overflow:hidden;min-height:313px;padding:25px;border:1px solid var(--line);border-radius:var(--r-lg);
      background:rgba(255,253,248,.9);box-shadow:var(--soft-shadow)
    }
