  <style>

    .work-grid{display:grid;grid-template-columns:minmax(0,1fr) 345px;gap:15px;align-items:start}.form-stack{display:grid;gap:15px}.panel{background:rgba(255,253,248,.88);border:1.5px solid var(--ink);padding:21px;box-shadow:5px 5px 0 rgba(24,35,56,.08);min-width:0}.panel.tint-blue{background:#e7edff}.panel.tint-yellow{background:#fff0b7}.panel.tint-green{background:#daf0e8}.panel.dark{background:var(--ink);color:#fff;box-shadow:5px 5px 0 var(--red)}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:14px;border-bottom:1px solid rgba(24,35,56,.16);margin-bottom:16px}.panel.dark .panel-head{border-color:rgba(255,255,255,.16)}.panel-head h3{font-family:"Archivo Black",sans-serif;font-size:19px;letter-spacing:-.5px;margin:0;line-height:1}.panel-head p{margin:6px 0 0;color:#626977;font-size:11px;line-height:1.5}.panel.dark .panel-head p{color:#bfc7d8}.panel-index{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:#fff;border:1px solid var(--ink);font:600 10px/1 "IBM Plex Mono",monospace;flex:none}.panel.dark .panel-index{background:var(--yellow);color:var(--ink)}

    .sticky{position:sticky;top:130px}.guide{display:grid;gap:12px}.guide-row{padding:12px;border-left:4px solid var(--blue);background:#fff9ec}.guide-row:nth-child(2){border-color:var(--red)}.guide-row:nth-child(3){border-color:var(--green)}.guide-row b{display:block;font-size:11px}.guide-row span{display:block;margin-top:3px;color:#687080;font-size:10px;line-height:1.5}
    .system-grid{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(320px,.96fr);gap:15px}.result-wrap{min-height:500px}.empty{min-height:430px;display:grid;place-items:center;text-align:center;padding:28px}.empty-box{max-width:330px}.empty-mark{width:62px;height:62px;margin:0 auto 15px;border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--red);display:grid;place-items:center;background:var(--yellow);font-size:24px}.empty h3{font-family:"Archivo Black",sans-serif;font-size:18px;letter-spacing:-.5px;margin:0 0 7px}.empty p{margin:0;color:#687080;font-size:12px;line-height:1.6}
    .direction-card{padding:14px;border:1.5px solid var(--ink);background:#fffdf8;margin-bottom:12px}.direction-card.selected{background:#e7edff;box-shadow:4px 4px 0 var(--blue)}.concept-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.concept-top h4{font-family:"Archivo Black",sans-serif;letter-spacing:-.5px;font-size:17px;line-height:1.05;margin:0}.concept-tag{font:600 9px/1 "IBM Plex Mono",monospace;letter-spacing:.8px;text-transform:uppercase;padding:7px;background:var(--yellow);color:var(--ink);border:1px solid var(--ink);white-space:nowrap}.direction-card p{font-size:11px;line-height:1.6;color:#626a76;margin:8px 0}.concept-copy{padding:11px;border-left:3px solid var(--red);background:#fff5e7;font-size:11px;line-height:1.55;color:#343d50}.concept-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .artboard{min-height:550px;background:var(--ink);border:1.5px solid var(--ink);box-shadow:7px 7px 0 var(--yellow);padding:17px;display:flex;flex-direction:column}.artboard-head{display:flex;justify-content:space-between;gap:9px;align-items:center;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.15);color:#cad4ea}.artboard-head b{font:600 9px/1 "IBM Plex Mono",monospace;letter-spacing:1px;text-transform:uppercase}.render-area{flex:1;margin-top:15px;display:grid;place-items:center;min-height:390px;background:linear-gradient(135deg,#324264,#1b263d);position:relative;overflow:hidden}.render-area:before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.16) .7px,transparent .8px);background-size:7px 7px;opacity:.4}.render-area img{position:relative;z-index:1;max-width:100%;max-height:500px;object-fit:contain}.render-placeholder{position:relative;z-index:1;text-align:center;color:#d9e3f7;max-width:300px}.render-placeholder strong{display:block;font-family:"Archivo Black",sans-serif;letter-spacing:-.7px;font-size:20px}.render-placeholder span{display:block;margin-top:7px;font-size:11px;line-height:1.55;color:#b9c9e5}.artboard-foot{padding-top:13px;display:flex;gap:9px;flex-wrap:wrap}.render-loader{width:50px;height:50px;border:4px solid rgba(255,255,255,.18);border-top-color:var(--yellow);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
    .handover-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(310px,.95fr);gap:15px}.doc{background:#fffdf8;border:1.5px solid var(--ink);padding:18px;min-height:470px;white-space:pre-wrap;font:500 11px/1.7 "IBM Plex Mono",monospace;color:#384255;overflow:auto}.doc h3{font-family:"Archivo Black",sans-serif}.check-list{display:grid;gap:10px}.check{display:flex;gap:9px;padding:11px;background:#fff9ec;border:1px solid #e4d3b8;font-size:11px;line-height:1.5}.check i{font-style:normal;color:var(--green);font-weight:900}.check b{display:block;color:#283650}
    .toast{position:fixed;right:20px;bottom:20px;z-index:200;max-width:360px;padding:12px 14px;background:var(--ink);color:#fff;border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--red);font-size:11px;line-height:1.45;display:none}.toast.show{display:block;animation:toast .25s ease both}@keyframes toast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div>
          <div class="brand-name">CETAK</div>
          <div class="brand-sub">Print Campaign Studio</div>
        </div>
      </div>
      <div class="head-actions">
        <div class="canvas-chip"><span class="canvas-dot"></span> Canvas generation mode</div>
        <button class="button small" onclick="resetProject()">Proyek baru</button>
      </div>
    </header>
    <nav class="stages" aria-label="Tahapan aplikasi">
      <button class="stage active" data-route="home">01 / Meja cetak</button>
      <button class="stage" data-route="brief">02 / Brief kampanye</button>
      <button class="stage" data-route="system">03 / Sistem desain</button>
      <button class="stage" data-route="studio">04 / Artboard</button>
      <button class="stage" data-route="handover">05 / Handover</button>
      <span class="session">Brief tersimpan lokal · gambar hanya untuk sesi ini</span>
    </nav>
    <main id="app" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast"></div>
<script>
/*
  CETAK is intentionally a single-file Gemini Canvas app.
  It keeps the Canvas pattern from the supplied source apps:
  - apiKey stays blank and is resolved by the Canvas runtime
  - direct client-side Gemini generateContent calls
  - exponential backoff + model fallback
  - optional inlineData reference image input
*/
const apiKey = "";
const TEXT_MODELS = ["gemini-2.5-flash-preview-09-2025", "gemini-2.5-flash"];
const IMAGE_MODELS = ["gemini-2.5-flash-image-preview"];
const STORAGE_KEY = "cetak_print_campaign_studio_v1";

const DEFAULT_STATE = {
  route: "home",
  brief: {
    brandName: "", campaignTitle: "", product: "", category: "Produk / Jasa", audience: "", objective: "Awareness + click", 
    message: "", offer: "", cta: "Pelajari lebih lanjut", proof: "", format: "Poster promo", ratio: "4:5", 
    visualTrack: "Risograph bold", tone: "Berani dan jelas", references: "", notes: "", transferPack: ""
  },
  asset: { data: "", mimeType: "", name: "" },
  design: null,
  selected: 0,
  render: "",
  loading: ""
};
function clone(v){return JSON.parse(JSON.stringify(v));}
function hydrate(saved){
  const base=clone(DEFAULT_STATE);
  if(!saved||typeof saved!=="object") return base;
  return {...base,...saved,brief:{...base.brief,...(saved.brief||{})},asset:{data:"",mimeType:"",name:""},render:"",loading:""};
}
function loadState(){try{return hydrate(JSON.parse(localStorage.getItem(STORAGE_KEY)));}catch{return clone(DEFAULT_STATE);}}
let state=loadState();
const app=document.getElementById("app");
const toast=document.getElementById("toast");
function persist(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({route:state.route,brief:clone(state.brief),design:state.design?clone(state.design):null,selected:state.selected}));}catch(e){console.warn("Tidak bisa menyimpan sesi",e)}
}
function esc(value){return String(value??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));}
function nl(value){return esc(value).replace(/\n/g,"<br>");}
function showToast(message,type="info"){
  toast.textContent=(type==="error"?"⚠ ":type==="success"?"✓ ":"✦ ")+message;
  toast.className="toast show";
  clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.className="toast",3800);
}
function setRoute(route){state.route=route;persist();render();window.scrollTo({top:0,behavior:"smooth"});}
function updateBrief(key,value){state.brief[key]=value;persist();}
function pickChoice(key,value){state.brief[key]=value;persist();render();}
function setSelected(index){state.selected=Number(index)||0;persist();render();}
function resetProject(){if(confirm("Mulai proyek baru? Brief dan output yang tersimpan lokal akan dihapus.")){state=clone(DEFAULT_STATE);persist();render();showToast("Proyek baru siap.","success");}}
function formatOptions(key,values){return `<div class="choice-row">${values.map((v,i)=>`<div class="choice"><input id="${key}-${i}" type="radio" name="${key}" value="${esc(v)}" ${state.brief[key]===v?"checked":""} onchange="pickChoice('${key}',this.value)"><label for="${key}-${i}">${esc(v)}</label></div>`).join("")}</div>`;}
function field(label,key,placeholder,required=false,full=false){return `<div class="field ${full?"full":""}"><label>${esc(label)} ${required?"<i>*</i>":""}</label><input value="${esc(state.brief[key])}" placeholder="${esc(placeholder)}" oninput="updateBrief('${key}',this.value)"></div>`;}

async function fetchModel(model,payload){
  const endpoint=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
  let delay=1000;let last;
  for(let i=0;i<5;i++){
    try{
      const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(res.ok) return await res.json();
      const text=await res.text();const err=new Error(`HTTP ${res.status}: ${text.slice(0,280)}`);err.status=res.status;last=err;
      if(res.status!==429&&res.status<500) throw err;
    }catch(error){last=error;if(error.status&&error.status!==429&&error.status<500) throw error;}
    if(i<4){await new Promise(r=>setTimeout(r,delay));delay*=2;}
  }
  throw last||new Error("Koneksi Gemini tidak tersedia.");
}
async function callModels(models,createPayload){let last;for(const model of models){try{return await fetchModel(model,createPayload());}catch(e){last=e;console.warn("Model fallback",model,e);}}throw last||new Error("Model tidak dapat dijalankan.");}

function cleanJson(raw){return String(raw||"").replace(/^\u0060{3}(?:json)?\s*/i,"").replace(/\s*\u0060{3}$/," ").trim();}
function extractText(data){return data?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("\n")||"";}
function parseJson(raw){try{return JSON.parse(cleanJson(raw));}catch{throw new Error("Respons desain tidak terbaca sebagai JSON. Coba ulangi.");}}
function imageParts(){return state.asset.data?[{inlineData:{data:state.asset.data.split(",")[1],mimeType:state.asset.mimeType}}]:[];}
const DESIGN_SCHEMA={
  type:"OBJECT",
  properties:{
    campaignStatement:{type:"STRING"},
    guardrail:{type:"STRING"},
    designSystem:{type:"OBJECT",properties:{palette:{type:"ARRAY",items:{type:"STRING"}},typography:{type:"STRING"},motifs:{type:"ARRAY",items:{type:"STRING"}},layoutRules:{type:"ARRAY",items:{type:"STRING"}},imageTreatment:{type:"STRING"}},required:["palette","typography","motifs","layoutRules","imageTreatment"]},
    concepts:{type:"ARRAY",items:{type:"OBJECT",properties:{id:{type:"STRING"},title:{type:"STRING"},format:{type:"STRING"},purpose:{type:"STRING"},headline:{type:"STRING"},subheadline:{type:"STRING"},cta:{type:"STRING"},layout:{type:"STRING"},artDirection:{type:"STRING"},copyNotes:{type:"STRING"},slides:{type:"ARRAY",items:{type:"OBJECT",properties:{slide:{type:"INTEGER"},role:{type:"STRING"},title:{type:"STRING"},body:{type:"STRING"}},required:["slide","role","title","body"]}}},required:["id","title","format","purpose","headline","subheadline","cta","layout","artDirection","copyNotes","slides"]}},
    productionChecklist:{type:"ARRAY",items:{type:"STRING"}},
    transferPack:{type:"STRING"}
  },required:["campaignStatement","guardrail","designSystem","concepts","productionChecklist","transferPack"]
};
function briefContext(){const b=state.brief;return `Brand: ${b.brandName}\nJudul campaign: ${b.campaignTitle}\nProduk/jasa: ${b.product}\nKategori: ${b.category}\nTarget: ${b.audience}\nTujuan: ${b.objective}\nPesan utama: ${b.message}\nOffer/fakta: ${b.offer}\nCTA: ${b.cta}\nProof yang tersedia: ${b.proof}\nFormat: ${b.format}\nRasio: ${b.ratio}\nArah visual: ${b.visualTrack}\nTone: ${b.tone}\nReferensi: ${b.references}\nCatatan: ${b.notes}\nTransfer pack: ${b.transferPack}\nAda foto produk: ${state.asset.data?"Ya":"Tidak"}`;}
function validateBrief(){const b=state.brief;return b.brandName.trim()&&b.campaignTitle.trim()&&b.product.trim()&&b.audience.trim()&&b.message.trim();}
async function generateSystem(){
  if(!validateBrief()){state.route="brief";render();showToast("Isi minimal brand, judul campaign, produk, audience, dan pesan utama.","error");return;}
  state.route="system";state.loading="system";render();
  const prompt=`You are a senior Indonesian print and social campaign art director. Build a practical campaign design system in Bahasa Indonesia from this brief:\n\n${briefContext()}\n\nReturn exactly 3 distinct concepts. Every concept must work as a ${state.brief.format} system, with a poster/cover plus ${state.brief.format.includes("Carousel")?"carousel slide plan":"adaptation notes"}. Headline/subheadline/CTA must use only safe claims and facts from the supplied brief. Never invent discounts, price, urgency, customer results, certifications, testimonial, stock limit, medical or financial claims. If proof is missing, say what proof should be collected.\n\nVisual execution rules:\n- Treat any uploaded photo only as truthful product reference where present.\n- Poster art should reserve clean negative space for later text overlay; generated image must not contain tiny or unreliable readable text.\n- artDirection must be complete English image-generation direction, specifying subject, composition, print treatment, colors, texture, lighting, requested ratio ${state.brief.ratio}, and must end with: "no watermark, no unrelated text, no fabricated claims".\n- Avoid public figures, competitor brands, logos not provided, or fabricated proof.\nReturn JSON only.`;
  try{const result=parseJson(extractText(await callModels(TEXT_MODELS,()=>({contents:[{role:"user",parts:[{text:prompt},...imageParts()]}],generationConfig:{responseMimeType:"application/json",responseSchema:DESIGN_SCHEMA,temperature:.75}}))));
    if(!Array.isArray(result.concepts)||!result.concepts.length)throw new Error("Sistem desain tidak memiliki konsep.");
    state.design={...result,concepts:result.concepts.slice(0,3)};state.selected=0;state.render="";state.loading="";persist();render();showToast("Tiga arah kampanye siap dipilih.","success");
  }catch(e){state.loading="";render();showToast(e.message||"Sistem desain gagal dibuat.","error");}
}
function selectedConcept(){return state.design?.concepts?.[state.selected]||null;}
async function renderCreative(){
  const concept=selectedConcept();if(!concept){state.route="system";render();showToast("Buat sistem desain terlebih dahulu.","error");return;}
  state.route="studio";state.loading="render";render();
  const b=state.brief;
  const ref=state.asset.data?"Use the attached image as the truthful product reference. Preserve its main silhouette, packaging hierarchy, prominent colors, material and recognizability as closely as possible.":"";
  const prompt=`Create one high-quality static campaign key visual for an Indonesian brand.\nBrand: ${b.brandName}\nCampaign: ${b.campaignTitle}\nProduct/service: ${b.product}\nTarget audience: ${b.audience}\nChosen concept: ${concept.title}\nPurpose: ${concept.purpose}\nArt direction: ${concept.artDirection}\nLayout note: ${concept.layout}\nRequested aspect ratio: ${b.ratio}\n${ref}\nImportant: generate the designed visual background/image only. Do NOT render marketing headline, CTA, price, claims, or other small readable text. Keep intentional clean negative space where the provided copy can be overlaid later. Do not include watermark, competitor brands, fake badges, fake reviews, or unverified results.`;
  try{const data=await callModels(IMAGE_MODELS,()=>({contents:[{role:"user",parts:[{text:prompt},...imageParts()]}],generationConfig:{responseModalities:["TEXT","IMAGE"]}}));
    const inline=data?.candidates?.[0]?.content?.parts?.find(p=>p.inlineData)?.inlineData;
    if(!inline?.data)throw new Error("Gemini tidak mengembalikan gambar. Coba render ulang.");
    state.render=`data:${inline.mimeType||"image/png"};base64,${inline.data}`;state.loading="";render();showToast("Key visual siap di artboard.","success");
  }catch(e){state.loading="";render();showToast(e.message||"Render gagal.","error");}
}
function onUpload(input){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith("image/")){showToast("Pilih file gambar.","error");return;}const reader=new FileReader();reader.onload=()=>{state.asset={data:reader.result,mimeType:file.type,name:file.name};render();showToast("Referensi produk dimuat.","success")};reader.readAsDataURL(file);}
function copySelectedArtDirection(){ const c=selectedConcept(); if(c?.artDirection) copyText(c.artDirection); else showToast("Belum ada konsep terpilih.","error"); }
function copyConceptArtDirection(index){ const c=state.design?.concepts?.[Number(index)]; if(c?.artDirection) copyText(c.artDirection); else showToast("Prompt belum tersedia.","error"); }
function copyText(text){const fallback=()=>{const area=document.createElement("textarea");area.value=text;area.style.position="fixed";area.style.opacity="0";document.body.appendChild(area);area.select();document.execCommand("copy");area.remove();};try{navigator.clipboard?.writeText?navigator.clipboard.writeText(text):fallback();showToast("Berhasil disalin.","success");}catch{try{fallback();showToast("Berhasil disalin.","success");}catch{showToast("Clipboard tidak tersedia.","error");}}}
function download(filename,content,type="text/markdown;charset=utf-8"){const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([content],{type}));link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),500);}

function handoverMarkdown(){const b=state.brief,d=state.design,c=selectedConcept();if(!d||!c)return `# CETAK — Campaign Draft\n\nLengkapi brief dan generate sistem desain terlebih dahulu.`;return `# ${b.brandName} — ${b.campaignTitle}\n\n## Campaign brief\n- Produk/jasa: ${b.product}\n- Target: ${b.audience}\n- Tujuan: ${b.objective}\n- Pesan: ${b.message}\n- Offer/fakta: ${b.offer||"—"}\n- CTA: ${b.cta}\n- Bukti yang tersedia: ${b.proof||"—"}\n- Format: ${b.format} (${b.ratio})\n\n## Campaign statement\n${d.campaignStatement}\n\n## Guardrail\n${d.guardrail}\n\n## Selected concept — ${c.title}\n- Purpose: ${c.purpose}\n- Headline: ${c.headline}\n- Subheadline: ${c.subheadline}\n- CTA: ${c.cta}\n- Layout: ${c.layout}\n- Copy notes: ${c.copyNotes}\n\n### Art direction\n${c.artDirection}\n\n## Carousel / adaptation deck\n${(c.slides||[]).map(s=>`### ${s.slide}. ${s.role}\n**${s.title}**\n${s.body}`).join("\n\n")}\n\n## Design system\n- Palette: ${(d.designSystem.palette||[]).join(" · ")}\n- Typography: ${d.designSystem.typography}\n- Motifs: ${(d.designSystem.motifs||[]).join(" · ")}\n- Image treatment: ${d.designSystem.imageTreatment}\n- Layout rules:\n${(d.designSystem.layoutRules||[]).map(x=>`  - ${x}`).join("\n")}\n\n## Production checklist\n${(d.productionChecklist||[]).map(x=>`- [ ] ${x}`).join("\n")}\n\n## Canvas Transfer Pack\n${transferPack()}\n`;}

function systemScreen(){const d=state.design;return `<section class="screen active"><div class="page-head"><div><div class="label">03 / Design system</div><h1>SISTEM DESAIN</h1><p>Pilih satu rute. Setiap rute mencakup copy hierarchy, aturan layout, slide plan, dan art direction yang siap diproduksi.</p></div><div class="stamp">${d?`${d.concepts?.length||0} concept routes`:"Awaiting brief"}</div></div>${state.loading==="system"?`<div class="panel"><div class="empty"><div class="empty-box"><div class="empty-mark">◌</div><h3>MENYUSUN SISTEM CETAK…</h3><p>Gemini sedang membentuk tiga rute campaign yang membedakan pesan, visual rhythm, serta kebutuhan produksi.</p></div></div></div>`:!d?`<div class="panel"><div class="empty"><div class="empty-box"><div class="empty-mark">✦</div><h3>BELUM ADA SISTEM DESAIN.</h3><p>Isi brief terlebih dahulu agar Cetak bisa membuat konsep yang menggunakan fakta campaign Anda, bukan asumsi.</p><button class="button red" onclick="setRoute('brief')" style="margin-top:16px">Isi brief →</button></div></div></div>`:`<div class="system-grid"><div class="panel result-wrap"><div class="panel-head"><div><h3>Campaign statement</h3><p>${esc(d.guardrail||"")}</p></div><div class="panel-index">◎</div></div><div class="concept-copy" style="border-left-color:var(--blue);margin-bottom:17px"><strong>${esc(d.campaignStatement||"")}</strong></div>${(d.concepts||[]).map((c,i)=>`<article class="direction-card ${state.selected===i?"selected":""}"><div class="concept-top"><div><h4>${esc(c.title)}</h4><p>${esc(c.purpose)}</p></div><span class="concept-tag">${esc(c.format)}</span></div><div class="concept-copy"><b>Headline:</b> ${esc(c.headline)}<br><b>Sub:</b> ${esc(c.subheadline)}<br><b>CTA:</b> ${esc(c.cta)}</div><p><b>Layout:</b> ${esc(c.layout)}</p><p><b>Copy note:</b> ${esc(c.copyNotes)}</p><div class="concept-actions"><button class="button small ${state.selected===i?"blue":""}" onclick="setSelected(${i})">${state.selected===i?"Dipilih":"Pilih rute"}</button><button class="button small" onclick="copyConceptArtDirection(${i})">Salin art direction</button></div></article>`).join("")}</div><aside class="form-stack"><section class="panel tint-green"><div class="panel-head"><div><h3>System board</h3><p>Aturan konsistensi untuk seluruh seri visual.</p></div><div class="panel-index">◫</div></div><div class="guide"><div class="guide-row"><b>Palette</b><span>${esc((d.designSystem?.palette||[]).join(" · "))}</span></div><div class="guide-row"><b>Typography</b><span>${esc(d.designSystem?.typography||"")}</span></div><div class="guide-row"><b>Motifs</b><span>${esc((d.designSystem?.motifs||[]).join(" · "))}</span></div><div class="guide-row"><b>Image treatment</b><span>${esc(d.designSystem?.imageTreatment||"")}</span></div></div><div style="margin-top:13px"><button class="button red full" onclick="setRoute('studio')">Lanjut ke artboard →</button></div></section><section class="panel tint-yellow"><div class="panel-head"><div><h3>Production checks</h3><p>Gunakan sebelum visual dipublikasikan.</p></div><div class="panel-index">✓</div></div><div class="check-list">${(d.productionChecklist||[]).slice(0,6).map(x=>`<div class="check"><i>□</i><span>${esc(x)}</span></div>`).join("")}</div></section></aside></div>`}</section>`;}
function studioScreen(){const c=selectedConcept();return `<section class="screen active"><div class="page-head"><div><div class="label">04 / Key visual artboard</div><h1>ARTBOARD</h1><p>Render visual dasar kampanye. Copy ditampilkan sebagai spec, bukan dipaksa masuk ke gambar, agar hasil tetap bisa diproduksi dan dibaca dengan akurat.</p></div><div class="stamp">${esc(state.brief.ratio)}</div></div>${!c?`<div class="panel"><div class="empty"><div class="empty-box"><div class="empty-mark">▧</div><h3>PILIH RUTE DAHULU.</h3><p>Artboard membutuhkan konsep dari Sistem Desain.</p><button class="button red" onclick="setRoute('system')" style="margin-top:16px">Ke sistem desain →</button></div></div></div>`:`<div class="system-grid"><section class="panel"><div class="panel-head"><div><h3>${esc(c.title)}</h3><p>${esc(c.purpose)}</p></div><div class="panel-index">${String(state.selected+1).padStart(2,"0")}</div></div><div class="concept-copy"><b>Headline</b><br>${esc(c.headline)}<br><br><b>Subheadline</b><br>${esc(c.subheadline)}<br><br><b>CTA</b><br>${esc(c.cta)}</div><div class="guide" style="margin-top:15px"><div class="guide-row"><b>Layout</b><span>${esc(c.layout)}</span></div><div class="guide-row"><b>Copy treatment</b><span>${esc(c.copyNotes)}</span></div><div class="guide-row"><b>Art direction</b><span>${esc(c.artDirection)}</span></div></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="button red" onclick="renderCreative()">${state.loading==="render"?"Merender…":"Render key visual"}</button><button class="button" onclick="copySelectedArtDirection()">Salin prompt</button><button class="button" onclick="setRoute('system')">Ganti rute</button></div></section><section class="artboard"><div class="artboard-head"><b>Key visual / ${esc(state.brief.ratio)}</b><b>${state.asset.data?"Product reference on":"Text-to-image"}</b></div><div class="render-area">${state.loading==="render"?`<div class="render-placeholder"><div class="render-loader"></div><strong>MENCETAK VISUAL…</strong><span>Menjaga negative space untuk copy serta menghindari teks kecil yang tidak stabil.</span></div>`:state.render?`<img src="${state.render}" alt="Key visual campaign">`:`<div class="render-placeholder"><strong>ARTBOARD SIAP.</strong><span>Pilih Render key visual untuk menghasilkan base creative dari konsep terpilih.</span></div>`}</div><div class="artboard-foot"><button class="button small primary" onclick="renderCreative()">↻ Render ulang</button><button class="button small" onclick="downloadImage()">↓ Download PNG</button><button class="button small" onclick="setRoute('handover')">Handover →</button></div></section></div>`}</section>`;}
function handoverScreen(){const c=selectedConcept(),d=state.design;const md=handoverMarkdown();return `<section class="screen active"><div class="page-head"><div><div class="label">05 / Production handover</div><h1>HANDOVER PACK</h1><p>Bawa system ini ke Canva, Figma, Gemini Canvas, designer, atau aplikasi lain dalam koleksi Anda.</p></div><div class="stamp">${d?"Ready to export":"Draft only"}</div></div><div class="handover-grid"><section class="panel"><div class="panel-head"><div><h3>Campaign document</h3><p>Blueprint yang menyatukan brief, concept, copy deck, visual rules, serta production checks.</p></div><div class="panel-index">MD</div></div><div class="doc">${nl(md)}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px"><button class="button red" onclick="download('cetak-campaign-pack.md',handoverMarkdown())">↓ Download Markdown</button><button class="button" onclick="copyText(handoverMarkdown())">Salin seluruh pack</button></div></section><aside class="form-stack"><section class="panel tint-blue"><div class="panel-head"><div><h3>Canvas Transfer Pack</h3><p>Format ringkas untuk dipaste ke Adsprint, Pikat, Rupa, Mula, Arah, Tayang, atau app berikutnya.</p></div><div class="panel-index">↗</div></div><div class="doc" style="min-height:245px;font-size:10px">${nl(transferPack())}</div><div style="margin-top:13px"><button class="button blue full" onclick="copyText(transferPack())">Salin Transfer Pack</button></div></section><section class="panel tint-yellow"><div class="panel-head"><div><h3>Quick production</h3><p>Gunakan sebelum terbit.</p></div><div class="panel-index">✓</div></div><div class="check-list"><div class="check"><i>□</i><span><b>Tambahkan text overlay di editor.</b> Gunakan headline dan CTA dari konsep, jangan mengandalkan teks di visual AI.</span></div><div class="check"><i>□</i><span><b>Verifikasi offer dan proof.</b> Publikasikan hanya klaim yang bisa dibuktikan dari sumber asli.</span></div><div class="check"><i>□</i><span><b>Adaptasikan format.</b> Gunakan slide plan untuk carousel atau variasi rasio untuk placement lain.</span></div></div>${c?`<div style="margin-top:13px"><button class="button green full" onclick="copySelectedArtDirection()">Salin prompt visual terpilih</button></div>`:""}</section></aside></div></section>`;}
function render(){document.querySelectorAll(".stage").forEach(el=>el.classList.toggle("active",el.dataset.route===state.route));const screens={home:homeScreen,brief:briefScreen,system:systemScreen,studio:studioScreen,handover:handoverScreen};app.innerHTML=(screens[state.route]||screens.home)();}
function loadDemo(){state.brief={...state.brief,brandName:"Kiyo Coffee",campaignTitle:"First Pour, Better Morning",product:"Kopi susu botol 250 ml",category:"F&B",audience:"Pekerja urban usia 22–35 yang butuh kopi praktis dengan rasa tidak terlalu manis",objective:"Awareness + click",message:"Pagi yang padat bisa dimulai dari satu pour yang terasa lebih tenang.",offer:"Tersedia 3 varian kopi susu botol. Detail harga dan menu ada di halaman produk.",cta:"Lihat menu lengkap",proof:"Foto produk asli, daftar menu valid, dan video proses pour.",format:"Carousel 5 slide",ratio:"4:5",visualTrack:"Risograph bold",tone:"Berani dan jelas",references:"Blue cobalt, red-orange, grain print, layout seperti poster konser modern.",notes:"Jangan pakai klaim kopi terbaik atau diskon yang tidak ada."};persist();setRoute("brief");showToast("Demo brief dimuat.","success");}
document.querySelectorAll(".stage").forEach(btn=>btn.addEventListener("click",()=>setRoute(btn.dataset.route)));
render();
</script>
</body>
</html>
