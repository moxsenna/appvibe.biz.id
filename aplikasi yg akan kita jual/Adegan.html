  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root{
      --ink:#121212; --ink-2:#1c1b19; --ink-3:#282621; --paper:#f4efe2; --paper-2:#e7decd;

    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--ink)}
    body{margin:0;min-width:320px;background:var(--ink);color:var(--paper);font-family:Manrope,system-ui,-apple-system,sans-serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
      radial-gradient(circle at 8% 4%,rgba(217,164,65,.13),transparent 28%),
      radial-gradient(circle at 90% 16%,rgba(114,185,181,.11),transparent 25%),
      linear-gradient(120deg,#10100f 0%,#191815 44%,#11110f 100%)}
    body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(244,239,226,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(244,239,226,.06) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 76%)}
    button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}
    ::selection{background:var(--warm);color:white}
    ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#151411}::-webkit-scrollbar-thumb{background:#49443b;border-radius:99px}

    .app{max-width:1510px;margin:0 auto;padding:14px 16px 42px}
    .masthead{position:sticky;top:10px;z-index:40;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:14px 16px;background:rgba(18,18,18,.92);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-mark{width:48px;height:48px;position:relative;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Instrument Serif",serif;font-size:26px;box-shadow:5px 5px 0 var(--warm)}
    .brand-mark:before,.brand-mark:after{content:"";position:absolute;left:7px;right:7px;height:4px;border-top:1px solid rgba(18,18,18,.35);border-bottom:1px solid rgba(18,18,18,.35)}.brand-mark:before{top:7px}.brand-mark:after{bottom:7px}
    .brand-word{font-family:"Instrument Serif",serif;font-size:30px;line-height:.8;letter-spacing:-.8px;color:var(--paper)}.brand-sub{margin-top:7px;color:#c9bdab;font:500 9px/1 "DM Mono",monospace;letter-spacing:1.35px;text-transform:uppercase;white-space:nowrap}
    .marquee{overflow:hidden;white-space:nowrap;color:#cfc5b6;font:500 10px/1 "DM Mono",monospace;letter-spacing:.5px;opacity:.76;position:relative}.marquee span{display:inline-block;padding-left:100%;animation:marquee 22s linear infinite}@keyframes marquee{to{transform:translateX(-100%)}}
    .canvas-chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);background:#1c1b18;color:#d9d0c3;font:500 10px/1 "DM Mono",monospace;white-space:nowrap}.canvas-chip i{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(135,197,169,.12)}

    .reel-nav{position:sticky;top:88px;z-index:31;display:flex;align-items:stretch;gap:5px;overflow-x:auto;margin:12px 0 0;padding:7px;background:rgba(32,30,26,.94);border:1px solid var(--line);backdrop-filter:blur(16px)}
    .reel-nav:before,.reel-nav:after{content:"";min-width:24px;background:repeating-linear-gradient(90deg,var(--paper) 0 5px,transparent 5px 12px);opacity:.42}.reel-nav:after{transform:scaleX(-1)}
    .reel-step{flex:none;border:1px solid transparent;background:transparent;color:#989084;padding:9px 13px;font:500 10px/1 "DM Mono",monospace;text-transform:uppercase;letter-spacing:.65px;transition:.18s}.reel-step span{display:inline-grid;place-items:center;width:18px;height:18px;margin-right:7px;background:rgba(255,255,255,.05);color:#cabfae;font-size:9px}.reel-step:hover{background:#24221e;color:#f4efe2}.reel-step.active{background:var(--paper);color:#131311;border-color:#fff4df;box-shadow:3px 3px 0 var(--warm)}.reel-step.active span{background:var(--warm);color:#fff}

    .screen{display:none;padding-top:20px}.screen.active{display:block;animation:rise .28s ease both}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    .eyebrow{font:500 10px/1 "DM Mono",monospace;letter-spacing:1.3px;text-transform:uppercase;color:#d6ad60}.eyebrow:before{content:"";display:inline-block;width:26px;height:1px;background:currentColor;vertical-align:middle;margin-right:8px}
    .hero{min-height:390px;position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);overflow:hidden;background:#161513;border:1px solid var(--line);box-shadow:var(--shadow)}
    .hero-copy{padding:47px 42px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}.hero h1{margin:17px 0 16px;font-family:"Instrument Serif",Georgia,serif;font-size:clamp(49px,6vw,87px);font-weight:400;letter-spacing:-2.7px;line-height:.88;color:var(--paper)}.hero h1 em{color:var(--amber);font-style:italic}.hero p{max-width:625px;color:#c8c0b3;font-size:14px;line-height:1.74;margin:0}.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
    .button{appearance:none;border:1px solid transparent;padding:12px 15px;background:#f4efe2;color:#141310;font-size:12px;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}.button:hover:not(:disabled){transform:translateY(-2px)}.button.primary{background:var(--amber);color:#2d1f05;box-shadow:0 6px 0 #9e722d}.button.warm{background:var(--warm);color:white;box-shadow:0 6px 0 #9e3e28}.button.dark{background:#282621;color:#f5eee1;border-color:#4a4439}.button.ghost{background:transparent;color:#d8d0c5;border-color:#504a40}.button.ghost:hover:not(:disabled){background:#24221e}.button.small{padding:8px 10px;font-size:10px}.button.teal{background:var(--teal);color:#102524;box-shadow:0 5px 0 #3c7b77}.button.danger{background:rgba(229,111,98,.09);color:#ffb3a9;border-color:rgba(229,111,98,.45)}
    .hero-monitor{position:relative;overflow:hidden;border-left:1px solid var(--line);background:#2a2822;min-height:280px}.monitor-frame{position:absolute;inset:27px 25px;background:#0e0e0d;border:9px solid #363229;box-shadow:18px 18px 0 rgba(217,95,61,.22)}.monitor-frame:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 69% 24%,rgba(217,164,65,.88) 0 9%,transparent 10%),linear-gradient(135deg,transparent 0 43%,rgba(114,185,181,.72) 44% 57%,transparent 58%),linear-gradient(30deg,#0d0d0c 0 24%,#4e6555 25% 38%,#1c1c19 39% 100%);filter:contrast(1.12) saturate(.82)}.monitor-frame:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.06) 0 1px,transparent 1px 4px);mix-blend-mode:soft-light}.monitor-caption{position:absolute;left:20px;right:20px;bottom:19px;z-index:1;display:flex;justify-content:space-between;gap:8px;color:#eee6d8;font:500 9px/1 "DM Mono",monospace;letter-spacing:.75px;text-transform:uppercase}.monitor-caption span:last-child{color:#e3ad4c}.hero-slate{position:absolute;right:22px;bottom:22px;padding:11px 13px;background:#f4efe2;color:#161513;font:500 10px/1.35 "DM Mono",monospace;transform:rotate(-3deg);box-shadow:5px 5px 0 var(--warm)}

    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:15px 0}.metric{min-height:108px;padding:16px;background:#1c1a17;border:1px solid var(--line)}.metric b{display:block;font-family:"Instrument Serif",serif;font-size:32px;font-weight:400;line-height:.95;color:var(--amber)}.metric span{display:block;margin-top:10px;color:#b8afa0;font-size:10px;line-height:1.45}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:30px 0 13px}.section-head h2{margin:8px 0 0;font-family:"Instrument Serif",serif;font-size:42px;font-weight:400;letter-spacing:-1.25px;line-height:.95}.section-head p{margin:0;max-width:500px;color:#aaa296;font-size:12px;line-height:1.65}.tag{padding:8px 9px;background:rgba(217,164,65,.1);border:1px solid rgba(217,164,65,.24);color:#eac578;font:500 9px/1 "DM Mono",monospace;text-transform:uppercase;letter-spacing:.7px;white-space:nowrap}
    .feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.feature{min-height:220px;padding:20px;background:#1b1a17;border:1px solid var(--line);display:flex;flex-direction:column}.feature:nth-child(2){background:#25231e}.feature:nth-child(3){background:#18201e}.feature-index{color:#d8aa59;font:500 10px/1 "DM Mono",monospace;letter-spacing:1px}.feature h3{margin:23px 0 8px;font-family:"Instrument Serif",serif;font-size:27px;font-weight:400;letter-spacing:-.5px;line-height:1}.feature p{margin:0;color:#b2aa9e;font-size:11px;line-height:1.65}.feature .button{margin-top:auto;align-self:flex-start}

    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:8px 0 17px}.page-head h1{margin:9px 0 0;font-family:"Instrument Serif",serif;font-size:50px;font-weight:400;letter-spacing:-1.5px;line-height:.92}.page-head p{margin:10px 0 0;max-width:730px;color:#aea69a;font-size:12px;line-height:1.65}.slate-tag{flex:none;padding:11px 12px;background:#f4efe2;color:#161513;font:500 9px/1 "DM Mono",monospace;letter-spacing:.8px;text-transform:uppercase;box-shadow:4px 4px 0 var(--warm)}
    .panel{background:#1a1916;border:1px solid var(--line);padding:20px;min-width:0}.panel.paper{background:var(--paper);color:#171512;border-color:#c9bda8}.panel.paper .panel-title h3{color:#1a1712}.panel.paper .panel-title p{color:#695f54}.panel.paper .field label{color:#5d544a}.panel.paper .field input,.panel.paper .field select,.panel.paper .field textarea{background:#fffaf0;color:#201c16;border-color:#d8cbb8}.panel.paper .hint{color:#7b7063}.panel.paper .divider{background:#dbcdb9}
    .panel-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;margin-bottom:17px;border-bottom:1px solid var(--line)}.panel-title h3{margin:0;font-family:"Instrument Serif",serif;font-size:29px;font-weight:400;letter-spacing:-.6px}.panel-title p{margin:6px 0 0;color:#aaa296;font-size:11px;line-height:1.55}.panel-number{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(244,239,226,.25);color:#e5bc67;font:500 10px/1 "DM Mono",monospace;flex:none}.panel.paper .panel-number{border-color:#c9bda8;color:#a66c2f}
    .form-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:13px;align-items:start}.form-stack{display:grid;gap:13px}.sticky{position:sticky;top:141px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:7px;color:#b9b0a3;font:500 9px/1 "DM Mono",monospace;letter-spacing:.85px;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;outline:none;border:1px solid #49443c;background:#23211d;color:#f4eee2;padding:11px 12px;font-size:12px;line-height:1.45;transition:.18s}.field textarea{min-height:92px;resize:vertical}.field input::placeholder,.field textarea::placeholder{color:#817b72}.field input:focus,.field textarea:focus,.field select:focus{border-color:#d9a441;box-shadow:0 0 0 3px rgba(217,164,65,.13)}
    .choice-row{display:flex;flex-wrap:wrap;gap:7px}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice label{display:flex;align-items:center;min-height:35px;margin:0;padding:8px 10px;border:1px solid #504a40;background:#22211d;color:#bcb4a7;font-size:10px;font-weight:700;text-transform:none;letter-spacing:0;cursor:pointer;transition:.18s}.choice input:checked+label{background:var(--amber);border-color:var(--amber);color:#2c210d;box-shadow:3px 3px 0 rgba(0,0,0,.22)}.panel.paper .choice label{background:#fffaf0;border-color:#d8cbb8;color:#6b6257}.panel.paper .choice input:checked+label{background:#e5bc67;border-color:#e5bc67;color:#2d210d}
    .upload{display:flex;align-items:center;gap:12px;padding:13px;border:1px dashed #756c5e;background:#24221d;cursor:pointer}.upload:hover{border-color:#d9a441;background:#2a2721}.panel.paper .upload{background:#fffaf0;border-color:#c8b99f}.upload-icon{width:40px;height:40px;display:grid;place-items:center;background:#343028;color:#e7be67;font-size:18px;flex:none}.upload b{display:block;font-size:12px}.upload span:not(.upload-icon){display:block;margin-top:4px;color:#9e9588;font-size:10px;line-height:1.5}.panel.paper .upload span:not(.upload-icon){color:#7d7164}.upload input{display:none}.upload-preview{width:52px;height:52px;overflow:hidden;display:grid;place-items:center;background:#322f28;border:1px solid #504a40;color:#e7be67;flex:none}.upload-preview img{width:100%;height:100%;object-fit:cover}
    .form-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}.hint{font-size:10px;line-height:1.5;color:#aaa296;max-width:60%}.divider{height:1px;background:var(--line);margin:14px 0}
    .guide{display:grid;gap:10px}.guide-row{padding:12px;background:#24221e;border-left:2px solid var(--amber)}.panel.paper .guide-row{background:#fff7e8;border-left-color:#cf8c32}.guide-row b{display:block;font-size:11px}.guide-row span{display:block;margin-top:4px;font-size:10px;color:#aaa296;line-height:1.55}.panel.paper .guide-row span{color:#6d6256}

    .treatment-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.treatment{position:relative;padding:20px;background:#1c1b18;border:1px solid var(--line);min-height:395px;display:flex;flex-direction:column;transition:.18s}.treatment.selected{background:#26221b;border-color:#d9a441;box-shadow:8px 8px 0 rgba(217,95,61,.52)}.treatment-num{color:#d7aa58;font:500 10px/1 "DM Mono",monospace;letter-spacing:1px}.treatment h3{margin:18px 0 8px;font-family:"Instrument Serif",serif;font-size:37px;line-height:.95;font-weight:400;letter-spacing:-.9px}.treatment .logline{color:#d9d0c3;font-size:12px;line-height:1.58}.treatment .divider{margin:16px 0}.treatment-meta{display:grid;gap:9px}.treatment-meta div span{display:block;color:#827a6e;font:500 9px/1 "DM Mono",monospace;letter-spacing:.7px;text-transform:uppercase}.treatment-meta div b{display:block;margin-top:4px;color:#d9d0c3;font-size:10px;line-height:1.5}.treatment .button{margin-top:auto;align-self:flex-start}
    .treatment-reco{margin-top:13px;padding:16px 17px;background:#21302d;border:1px solid rgba(114,185,181,.32);color:#d7ebe5;font-size:12px;line-height:1.63}.treatment-reco b{color:#9ed8d4}
    .empty{min-height:315px;display:grid;place-items:center;text-align:center;padding:28px;color:#aaa296;border:1px dashed #5a544a;background:#191815}.empty-icon{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 16px;background:#2a2823;color:#e4b95f;font-size:25px}.empty h3{margin:0 0 8px;font-family:"Instrument Serif",serif;font-size:29px;font-weight:400;color:#e7dfd3}.empty p{margin:0;max-width:370px;font-size:11px;line-height:1.65}

    .shot-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:13px;align-items:start}.director-card{position:sticky;top:141px;padding:19px;background:#231f18;border:1px solid rgba(217,164,65,.36)}.director-card h3{margin:10px 0 7px;font-family:"Instrument Serif",serif;font-size:33px;font-weight:400;line-height:.92}.director-card p{margin:0;color:#bfb4a5;font-size:11px;line-height:1.6}.director-card .rule{margin:16px 0;border-top:1px solid rgba(244,239,226,.13)}.director-card .mini{font:500 9px/1.4 "DM Mono",monospace;color:#dbb35b;text-transform:uppercase;letter-spacing:.8px}.director-card ul{margin:10px 0 0;padding-left:17px;color:#c8beae;font-size:10px;line-height:1.65}.director-card .button{margin-top:16px;width:100%}
    .scene-stack{display:grid;gap:10px}.scene{background:#1a1916;border:1px solid var(--line);display:grid;grid-template-columns:88px minmax(0,1fr);min-height:180px}.scene-index{padding:15px;background:#24211d;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}.scene-index b{font-family:"Instrument Serif",serif;font-size:44px;font-weight:400;line-height:.8;color:#e3b760}.scene-index span{font:500 9px/1.35 "DM Mono",monospace;color:#b5ab9d;letter-spacing:.3px}.scene-main{padding:16px}.scene-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.scene-head h3{margin:0;font-size:14px;letter-spacing:-.2px}.scene-head p{margin:4px 0 0;color:#a9a094;font-size:10px;line-height:1.45}.scene-time{padding:7px 8px;background:#2a2823;color:#e7be67;font:500 9px/1 "DM Mono",monospace;white-space:nowrap}.scene-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.scene-block{padding:10px;background:#24221e}.scene-block .mini-label{color:#d9a441;font:500 9px/1 "DM Mono",monospace;text-transform:uppercase;letter-spacing:.65px}.scene-block p{margin:5px 0 0;color:#cbc2b5;font-size:10px;line-height:1.58}.scene-prompt{grid-column:1/-1;background:#1d2624;border-left:2px solid var(--teal)}.scene-prompt .mini-label{color:#9edbd6}.scene-footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .edit-map{margin-bottom:13px;padding:18px;background:#f4efe2;color:#1c1914;border:1px solid #cfc0ab}.edit-map h3{margin:0;font-family:"Instrument Serif",serif;font-size:32px;font-weight:400;letter-spacing:-.7px}.edit-map p{margin:6px 0 0;font-size:11px;color:#675d52;line-height:1.65}.edit-map-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:14px}.edit-map-box{padding:12px;background:#fffaf0;border:1px solid #dfd1bd}.edit-map-box b{display:block;color:#5f4930;font:500 9px/1 "DM Mono",monospace;text-transform:uppercase;letter-spacing:.7px}.edit-map-box span{display:block;margin-top:7px;font-size:11px;line-height:1.55;color:#463d34}

    .frame-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:13px;align-items:start}.frame-controls{position:sticky;top:141px}.frame-stage{min-height:480px;background:#0f0f0e;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative}.frame-stage img{max-width:100%;max-height:600px;display:block;object-fit:contain}.frame-empty{padding:30px;text-align:center;color:#aaa296}.frame-empty .clap{font-size:46px;color:#e2b65d}.frame-overlay{position:absolute;left:16px;right:16px;bottom:15px;display:flex;justify-content:space-between;gap:10px;color:#efe8dc;font:500 9px/1 "DM Mono",monospace;letter-spacing:.5px;text-transform:uppercase;text-shadow:0 1px 8px #000}.frame-overlay span:last-child{color:#e5b85c}.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:13px}.contact{position:relative;border:1px solid var(--line);background:#25231e;aspect-ratio:4/3;overflow:hidden}.contact img{width:100%;height:100%;object-fit:cover}.contact .contact-label{position:absolute;left:7px;bottom:7px;padding:4px 6px;background:rgba(18,18,17,.85);color:#f6e6c5;font:500 9px/1 "DM Mono",monospace}

    .handover-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:13px;align-items:start}.handover-block{padding:18px;background:#191815;border:1px solid var(--line)}.handover-block h3{margin:0;font-family:"Instrument Serif",serif;font-size:31px;font-weight:400;letter-spacing:-.6px}.handover-block p{margin:7px 0 0;color:#aaa296;font-size:11px;line-height:1.6}.codebox{margin-top:14px;padding:15px;background:#11110f;border:1px solid #3e392f;color:#ded4c4;font:400 10px/1.65 "DM Mono",monospace;white-space:pre-wrap;overflow:auto;max-height:400px}.handover-list{display:grid;gap:8px;margin-top:13px}.handover-line{padding:11px 12px;border-left:2px solid var(--amber);background:#24221d;font-size:10px;line-height:1.5;color:#c9c0b3}.handover-line b{color:#efd083}.handover-note{padding:17px;background:#21302d;border:1px solid rgba(114,185,181,.32);color:#d5ebe5;font-size:11px;line-height:1.65}.handover-note b{color:#9edbd6}

    .toast{position:fixed;z-index:100;right:18px;bottom:18px;max-width:min(420px,calc(100vw - 36px));padding:13px 15px;background:#f4efe2;color:#1c1914;border-left:5px solid var(--amber);box-shadow:0 20px 46px rgba(0,0,0,.35);font-size:11px;line-height:1.45;display:none}.toast.show{display:flex;align-items:flex-start;gap:10px;animation:toast .25s ease both}@keyframes toast{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.toast.error{border-left-color:var(--danger)}.toast strong{font-size:12px}.toast button{margin-left:auto;background:transparent;border:0;color:#5f564b;font-size:16px;padding:0;line-height:1}

    @media(max-width:1120px){.hero{grid-template-columns:1fr}.hero-monitor{min-height:265px;border-left:0;border-top:1px solid var(--line)}.form-layout,.frame-layout,.handover-grid{grid-template-columns:1fr}.sticky,.frame-controls{position:static}.shot-layout{grid-template-columns:1fr}.director-card{position:static}.treatment-grid{grid-template-columns:1fr}.treatment{min-height:0}.scene-grid{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.app{padding:9px 10px 32px}.masthead{grid-template-columns:1fr auto;padding:11px 12px}.marquee{display:none}.brand-word{font-size:27px}.canvas-chip{padding:9px}.canvas-chip span{display:none}.reel-nav{top:76px;margin-top:9px}.reel-step{padding:8px 10px}.reel-step span{margin-right:4px}.hero-copy{padding:34px 24px}.hero h1{font-size:52px}.hero-monitor{min-height:220px}.monitor-frame{inset:22px 18px}.hero-slate{right:14px;bottom:15px}.metrics{grid-template-columns:1fr 1fr}.metric{min-height:94px}.section-head,.page-head{display:block}.section-head p{margin-top:11px}.tag,.slate-tag{display:inline-flex;margin-top:12px}.feature-grid{grid-template-columns:1fr}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.form-footer{align-items:flex-start;flex-direction:column}.hint{max-width:none}.scene{grid-template-columns:61px minmax(0,1fr)}.scene-index{padding:11px}.scene-index b{font-size:31px}.scene-grid{grid-template-columns:1fr}.contact-grid{grid-template-columns:1fr 1fr}.edit-map-grid{grid-template-columns:1fr}.button{min-height:38px}.canvas-chip{font-size:9px}.page-head h1{font-size:43px}}
  </style>

<body>
  <main id="app"></main>
  <div id="toast" class="toast"></div>

<script>
/* Gemini Canvas pattern: leave blank. Canvas supplies runtime auth context. */
const apiKey = "";
const TEXT_MODELS = ["gemini-2.5-flash-preview-09-2025", "gemini-2.5-flash"];
const IMAGE_MODELS = ["gemini-2.5-flash-image-preview", "gemini-3.1-flash-image"];
const STORE_KEY = "adegan-directors-treatment-lab-v1";

const defaultBrief = {
  brandName:"", projectTitle:"", product:"", category:"Produk / jasa", audience:"", objective:"Awareness + consideration",
  message:"", proof:"", cta:"", videoType:"Brand film", platform:"Instagram / TikTok", ratio:"9:16", duration:"30 detik",
  pace:"Terukur & sinematik", speechMode:"Voice-over ringan", visualLanguage:"Cinematic tactile", mood:"Hangat & percaya diri",
  references:"", transferPack:"", guardrails:"", notes:""
};
const state = { route:"home", brief:{...defaultBrief}, asset:{data:"",name:""}, treatments:null, activeTreatmentIndex:0, shotbook:null, frames:{}, activeSceneIndex:0, loading:{}, toast:null };

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if(saved && saved.brief){
      state.brief = {...defaultBrief, ...saved.brief};
      state.treatments = saved.treatments || null;
      state.activeTreatmentIndex = Number(saved.activeTreatmentIndex || 0);
      state.shotbook = saved.shotbook || null;
      state.route = saved.route || "home";
    }
  }catch(err){ console.warn("Unable to restore ADEGAN state", err); }
}
function persist(){
  const payload = { brief:state.brief, treatments:state.treatments, activeTreatmentIndex:state.activeTreatmentIndex, shotbook:state.shotbook, route:state.route };
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(payload)); }catch(err){ console.warn("Unable to store ADEGAN state", err); }
}
function esc(value=""){ return String(value).replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c])); }
function isBusy(key){ return Boolean(state.loading[key]); }
function notify(message, type="success"){
  state.toast={message,type}; const toast=document.getElementById("toast"); if(!toast) return;
  toast.className=`toast show ${type === "error" ? "error" : ""}`;
  toast.innerHTML=`<span>${type === "error" ? "⚠" : "✦"}</span><div><strong>${type === "error" ? "Tidak selesai" : "Selesai"}</strong><br>${esc(message)}</div><button onclick="hideToast()">×</button>`;
  clearTimeout(window.__adeganToast); window.__adeganToast=setTimeout(hideToast,5600);
}
function hideToast(){ const toast=document.getElementById("toast"); if(toast){ toast.className="toast"; toast.innerHTML=""; } }
function setRoute(route){ state.route=route; persist(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
function updateBrief(key,value){ state.brief[key]=value; persist(); }
function setChoice(key,value){ state.brief[key]=value; persist(); render(); }
function choice(name,label,value,selected){ return `<div class="choice"><input id="${esc(name+value)}" type="radio" name="${esc(name)}" ${selected===value?"checked":""} onchange="setChoice('${esc(name)}','${esc(value)}')"><label for="${esc(name+value)}">${esc(label)}</label></div>`; }
function choices(name, items, selected){ return `<div class="choice-row">${items.map(item=>choice(name,item,item,selected)).join("")}</div>`; }
function field(label,key,placeholder="",required=false,full=false){ const b=state.brief; return `<div class="field ${full?"full":""}"><label>${esc(label)}${required?" · wajib":""}</label><input value="${esc(b[key]||"")}" placeholder="${esc(placeholder)}" oninput="updateBrief('${esc(key)}',this.value)"></div>`; }
function textarea(label,key,placeholder="",helper="",required=false,full=true){ const b=state.brief; return `<div class="field ${full?"full":""}"><label>${esc(label)}${required?" · wajib":""}</label><textarea placeholder="${esc(placeholder)}" oninput="updateBrief('${esc(key)}',this.value)">${esc(b[key]||"")}</textarea>${helper?`<div class="hint">${esc(helper)}</div>`:""}</div>`; }
function select(label,key,items,full=false){ const b=state.brief; return `<div class="field ${full?"full":""}"><label>${esc(label)}</label><select onchange="updateBrief('${esc(key)}',this.value)">${items.map(item=>`<option ${b[key]===item?"selected":""}>${esc(item)}</option>`).join("")}</select></div>`; }
function button(label, action, cls="button", disabled=false){ return `<button class="${cls}" ${disabled?"disabled":""} onclick="${action}">${label}</button>`; }
function treatmentReady(){ return Array.isArray(state.treatments?.treatments) && state.treatments.treatments.length > 0; }
function shotbookReady(){ return Array.isArray(state.shotbook?.scenes) && state.shotbook.scenes.length > 0; }
function activeTreatment(){ return state.treatments?.treatments?.[state.activeTreatmentIndex] || state.treatments?.treatments?.[0] || null; }
function currentScene(){ return state.shotbook?.scenes?.[state.activeSceneIndex] || state.shotbook?.scenes?.[0] || null; }
function briefReady(){ const b=state.brief; return Boolean(b.brandName.trim() && b.product.trim() && b.audience.trim() && b.message.trim() && b.cta.trim()); }
function frameCount(){ return Object.values(state.frames).filter(Boolean).length; }

function shell(content){
  const steps=[ ["home","00","Studio"], ["brief","01","Brief"], ["treatment","02","Treatment"], ["shotbook","03","Shotbook"], ["frame","04","Frame Lab"], ["handover","05","Handover"] ];
  return `<div class="app"><header class="masthead"><div class="brand"><div class="brand-mark">A</div><div><div class="brand-word">ADEGAN</div><div class="brand-sub">Director's treatment lab</div></div></div><div class="marquee"><span>DIRECTOR'S DESK · STORY ARCHITECTURE · SHOT LANGUAGE · KEYFRAME STUDY · PRODUCTION HANDOVER · &nbsp;&nbsp;&nbsp; DIRECTOR'S DESK · STORY ARCHITECTURE · SHOT LANGUAGE · KEYFRAME STUDY · PRODUCTION HANDOVER ·</span></div><div class="canvas-chip"><i></i><span>Canvas ready</span></div></header><nav class="reel-nav">${steps.map(([route,num,label])=>`<button class="reel-step ${state.route===route?"active":""}" onclick="setRoute('${route}')"><span>${num}</span>${label}</button>`).join("")}</nav>${content}</div>`;
}

function homeScreen(){
  const treatments = treatmentReady() ? "03" : "—"; const scenes = shotbookReady() ? String(state.shotbook.scenes.length).padStart(2,"0") : "—";
  return `<section class="screen active"><div class="hero"><div class="hero-copy"><div class="eyebrow">Independent video direction system</div><h1>JANGAN HANYA<br>BUAT VIDEO.<br><em>ARAHKAN ADEGAN.</em></h1><p>Adegan menerjemahkan pesan brand menjadi director's treatment, narasi, bahasa kamera, shotbook, dan keyframe reference—siap diserahkan ke Gemini, Flow, Veo, editor, atau production crew.</p><div class="hero-actions">${button("Mulai dari brief →","setRoute('brief')","button primary")}${button("Muat contoh director's desk","loadDemo()","button ghost")}</div></div><div class="hero-monitor"><div class="monitor-frame"><div class="monitor-caption"><span>Cam A · Study frame</span><span>00:00:04:12</span></div></div><div class="hero-slate">PROJECT / UNTITLED<br>TAKE / 01<br>ROLL / A-001</div></div></div><div class="metrics"><div class="metric"><b>${treatments}</b><span>treatment berbeda untuk satu brief</span></div><div class="metric"><b>${scenes}</b><span>scene dalam shotbook aktif</span></div><div class="metric"><b>${String(frameCount()).padStart(2,"0")}</b><span>keyframe reference yang sudah dirender</span></div><div class="metric"><b>MD</b><span>handover yang bisa dibawa ke tool produksi lain</span></div></div><div class="section-head"><div><div class="eyebrow">Workflow</div><h2>SEBUAH VIDEO DIMULAI DARI KEPUTUSAN.</h2></div><p>Adegan membuat Anda memilih ide, durasi, ritme, dan bahasa visual lebih dulu. Baru setelah itu setiap shot punya alasan, fungsi, dan instruksi produksi.</p></div><div class="feature-grid"><article class="feature"><div class="feature-index">01 / The brief</div><h3>Tentukan satu hal yang harus terasa.</h3><p>Masukkan produk, audience, pesan, proof yang tersedia, CTA, platform, format, dan batasan klaim.</p>${button("Isi brief →","setRoute('brief')","button small")}</article><article class="feature"><div class="feature-index">02 / The treatment</div><h3>Pilih bahasa filmnya.</h3><p>Dapatkan tiga treatment berbeda lengkap dengan logline, camera language, world, opening, closing, dan sound direction.</p>${button("Buka treatment →","setRoute('treatment')","button small")}</article><article class="feature"><div class="feature-index">03 / The shotbook</div><h3>Turunkan menjadi adegan.</h3><p>Bangun scene-by-scene plan, keyframe reference, visual prompt, transition, subtitle cue, dan handover produksi.</p>${button("Buka shotbook →","setRoute('shotbook')","button small")}</article></div></section>`;
}

function briefScreen(){ const b=state.brief; return `<section class="screen active"><div class="page-head"><div><div class="eyebrow">01 / Director intake</div><h1>PROJECT BRIEF</h1><p>Isi fakta yang memang tersedia. Adegan menggunakannya sebagai sumber kebenaran untuk treatment dan tidak akan membuat testimoni, metrik, manfaat, atau klaim yang tidak Anda berikan.</p></div><div class="slate-tag">${esc(b.ratio)} · ${esc(b.duration)}<br>${esc(b.platform)}</div></div><div class="form-layout"><div class="form-stack"><section class="panel paper"><div class="panel-title"><div><h3>Project identity</h3><p>Informasi dasar yang akan muncul di slate dan treatment.</p></div><div class="panel-number">01</div></div><div class="field-grid">${field("Nama brand","brandName","Contoh: Tumbuh Coffee",true)}${field("Judul project","projectTitle","Contoh: First light",false)}${field("Produk / jasa / offer","product","Contoh: cold brew oat latte",true)}${select("Kategori","category",["Produk / jasa","F&B","Beauty & personal care","Fashion","Digital product","Jasa profesional","Property","Education","Event / community"])}${field("Audiens utama","audience","Contoh: pekerja kreatif usia 22–34",true,true)}${textarea("Pesan utama","message","Apa satu pesan yang perlu terasa setelah video selesai?","Gunakan pesan yang dapat dibuktikan oleh produk, demo, atau pengalaman nyata.",true)}</div></section><section class="panel"><div class="panel-title"><div><h3>Truth, CTA, guardrails</h3><p>Supaya naskah tidak melebihkan kemampuan produk atau membuat proof palsu.</p></div><div class="panel-number">02</div></div><div class="field-grid">${select("Tujuan video","objective",["Awareness + consideration","Product launch","Traffic ke landing page","Traffic ke marketplace","Lead collection","Event registration","Reactivation","Brand story"])}${field("CTA utama","cta","Contoh: Lihat menu dan lokasi",true)}${textarea("Proof / fakta yang tersedia","proof","Contoh: foto produk asli, demo pemakaian, 30 review marketplace, tanggal event yang sudah pasti","Jika belum ada, tulis 'belum ada'. Adegan akan merekomendasikan proof yang perlu diproduksi.",false)}${textarea("Guardrails / hal yang dilarang","guardrails","Contoh: jangan klaim paling sehat, jangan menampilkan harga sebelum disetujui, jangan buat review palsu","",false)}</div></section><section class="panel"><div class="panel-title"><div><h3>Format & language</h3><p>Keputusan produksi yang menentukan struktur adegan.</p></div><div class="panel-number">03</div></div><div class="field-grid"><div class="field full"><label>Tipe video</label>${choices("videoType",["Brand film","Product film","Performance ad","Founder story","Explainer","Event teaser","Case study"],b.videoType)}</div><div class="field full"><label>Platform</label>${choices("platform",["Instagram / TikTok","YouTube Shorts","YouTube / web","Landing page","LinkedIn","Offline event"],b.platform)}</div><div class="field full"><label>Aspek rasio</label>${choices("ratio",["9:16","4:5","1:1","16:9","4:3"],b.ratio)}</div><div class="field full"><label>Durasi</label>${choices("duration",["15 detik","30 detik","45 detik","60 detik","90 detik"],b.duration)}</div><div class="field full"><label>Pace / rhythm</label>${choices("pace",["Cepat & energik","Terukur & sinematik","Pelan & observasional","Cerdas & informatif","Hangat & intim"],b.pace)}</div><div class="field full"><label>Mode suara</label>${choices("speechMode",["Voice-over ringan","Dialog natural","Tanpa dialog","Founder to camera","Text cue minimal"],b.speechMode)}</div><div class="field full"><label>Visual language</label>${choices("visualLanguage",["Cinematic tactile","Documentary raw","Polished studio","Editorial minimal","Analog 16mm","Bold commercial"],b.visualLanguage)}</div><div class="field full"><label>Mood utama</label>${choices("mood",["Hangat & percaya diri","Intim & jujur","Berani & optimistis","Tenang & premium","Playful & hidup","Misterius & cinematic"],b.mood)}</div>${textarea("Referensi visual","references","Tulis referensi, warna, pacing, material, setting, atau hal yang ingin dihindari.","",false)}${textarea("Canvas Transfer Pack","transferPack","Paste [CANVAS-BRIEF v1] dari ARAH, MULA, Adsprint, atau aplikasi lain (opsional).","",false)}</div></section><section class="panel"><div class="panel-title"><div><h3>Reference object</h3><p>Opsional. Dipakai untuk menjaga bentuk produk atau packaging saat membuat keyframe reference.</p></div><div class="panel-number">04</div></div><label class="upload"><div class="upload-preview">${state.asset.data?`<img src="${state.asset.data}" alt="Preview referensi">`:"◒"}</div><div><b>${state.asset.name?esc(state.asset.name):"Upload foto produk / objek utama"}</b><span>${state.asset.name?"Ganti gambar bila perlu. Aset ini hanya disimpan selama sesi tab aktif.":"PNG, JPG, WEBP. Tidak disimpan ke server."}</span></div><input type="file" accept="image/*" onchange="onUpload(this)"></label></section><div class="form-footer"><div class="hint">Setelah brief lengkap, Adegan membuat tiga director's treatment. Pilih satu untuk diturunkan menjadi shotbook.</div>${button(isBusy("treatments")?"Menyusun treatment…":"Buat 3 treatment →","makeTreatments()","button primary",isBusy("treatments"))}</div></div><aside class="sticky"><section class="panel"><div class="panel-title"><div><h3>Rules of the set</h3><p>Guardrail yang dipakai dalam setiap output.</p></div><div class="panel-number">!</div></div><div class="guide"><div class="guide-row"><b>Mulai dari fakta, bukan efek.</b><span>Proof yang ada akan dipakai. Bila belum ada proof, output akan menyebutkan jenis footage atau bukti yang perlu dikumpulkan.</span></div><div class="guide-row"><b>Tekankan satu dramatisasi.</b><span>Setiap treatment dibangun dengan satu konflik, satu rasa, dan satu keputusan penonton—bukan daftar semua benefit.</span></div><div class="guide-row"><b>Keyframe bukan iklan siap tayang.</b><span>Frame Lab menghasilkan referensi visual tanpa teks kecil atau klaim yang berisiko salah eja. Copy tetap diberikan sebagai overlay spec yang bisa Anda edit.</span></div></div></section></aside></div></section>`; }

function treatmentScreen(){
  if(!treatmentReady()) return `<section class="screen active"><div class="page-head"><div><div class="eyebrow">02 / Director's treatment</div><h1>PILIH FILMNYA.</h1><p>Treatment adalah keputusan kreatif sebelum produksi dimulai: apa yang penonton lihat, rasakan, dengar, dan ingat.</p></div><div class="slate-tag">TREATMENT / —</div></div><div class="empty"><div><div class="empty-icon">◧</div><h3>Belum ada treatment.</h3><p>Lengkapi Project Brief lebih dulu. Adegan akan membuat tiga rute kreatif yang berbeda untuk dipilih.</p><div style="margin-top:16px">${button("Ke Project Brief →","setRoute('brief')","button primary")}</div></div></div></section>`;
  const t=state.treatments;
  return `<section class="screen active"><div class="page-head"><div><div class="eyebrow">02 / Director's treatment</div><h1>PILIH FILMNYA.</h1><p>${esc(t.campaignNorthStar||"Pilih satu arah cerita yang paling selaras dengan pesan dan batas produksi Anda.")}</p></div><div class="slate-tag">${t.treatments.length} ROUTES<br>${esc(state.brief.duration)}</div></div><div class="treatment-grid">${t.treatments.map((item,i)=>treatmentCard(item,i)).join("")}</div><div class="treatment-reco"><b>Director's note — </b>${esc(t.recommendedSequence||"Pilih treatment yang paling jujur terhadap proof, format, dan sumber daya produksi Anda.")}</div><div class="form-footer"><div class="hint">Anda dapat generate ulang treatment bila brief atau arah produksi berubah. Shotbook akan direset saat treatment baru dibuat.</div><div style="display:flex;gap:8px;flex-wrap:wrap">${button("Edit brief","setRoute('brief')","button ghost")}${button(isBusy("treatments")?"Menyusun ulang…":"Generate ulang","makeTreatments()","button dark",isBusy("treatments"))}${button("Lanjut ke shotbook →","setRoute('shotbook')","button primary")}</div></div></section>`;
}
function treatmentCard(item,index){ const selected=index===state.activeTreatmentIndex; return `<article class="treatment ${selected?"selected":""}"><div class="treatment-num">ROUTE / ${String(index+1).padStart(2,"0")}</div><h3>${esc(item.title||`Treatment ${index+1}`)}</h3><p class="logline">${esc(item.logline||"")}</p><div class="divider"></div><div class="treatment-meta"><div><span>Core idea</span><b>${esc(item.coreIdea||"")}</b></div><div><span>Camera language</span><b>${esc(item.cameraLanguage||"")}</b></div><div><span>Sound world</span><b>${esc(item.soundDirection||"")}</b></div><div><span>Opening → close</span><b>${esc(item.opening||"")} → ${esc(item.closing||"")}</b></div></div><div style="margin-top:13px;color:#9e968a;font-size:10px;line-height:1.57"><b style="color:#ded4c4">Production scope:</b><br>${esc(item.productionScope||"")}</div>${button(selected?"Treatment aktif":"Pilih treatment",`selectTreatment(${index})`,`button ${selected?"teal":"ghost"} small`)}</article>`; }

function shotbookScreen(){
  if(!treatmentReady()) return `<section class="screen active"><div class="page-head"><div><div class="eyebrow">03 / Shotbook</div><h1>ADEGAN PER ADEGAN.</h1><p>Pilih treatment dulu agar setiap shot punya alasan dan fungsi.</p></div></div><div class="empty"><div><div class="empty-icon">▣</div><h3>Pilih treatment lebih dulu.</h3><p>Shotbook dibangun dari satu treatment yang aktif, bukan dari prompt visual acak.</p><div style="margin-top:16px">${button("Buka Treatment →","setRoute('treatment')","button primary")}</div></div></div></section>`;
  const tr=activeTreatment();
  if(!shotbookReady()) return `<section class="screen active"><div class="page-head"><div><div class="eyebrow">03 / Shotbook</div><h1>TURUNKAN MENJADI SHOT.</h1><p>${esc(tr?.logline||"Treatment aktif siap diterjemahkan menjadi rundown scene-by-scene.")}</p></div><div class="slate-tag">${esc(tr?.title||"—")}<br>SELECTED</div></div><div class="empty"><div><div class="empty-icon">▣</div><h3>Shotbook belum dibuat.</h3><p>Adegan akan membuat scene plan, waktu, camera move, dialog, sound cue, on-screen text, visual prompt, dan transition untuk treatment yang dipilih.</p><div style="margin-top:16px">${button(isBusy("shotbook")?"Menyusun shotbook…":"Buat Shotbook →","makeShotbook()","button primary",isBusy("shotbook"))}</div></div></div></section>`;
  const s=state.shotbook;
  return `<section class="screen active"><div class="page-head"><div><div class="eyebrow">03 / Shotbook</div><h1>ADEGAN PER ADEGAN.</h1><p>${esc(s.masterDirection||tr?.logline||"")}</p></div><div class="slate-tag">${s.scenes.length} SCENES<br>${esc(s.totalDuration||state.brief.duration)}</div></div><div class="shot-layout"><aside class="director-card"><div class="eyebrow">Treatment active</div><h3>${esc(tr?.title||"Director's route")}</h3><p>${esc(tr?.coreIdea||"")}</p><div class="rule"></div><div class="mini">Edit strategy</div><p>${esc(s.editStrategy||"")}</p><div class="rule"></div><div class="mini">Audio direction</div><p>${esc(s.audioDirection||"")}</p><div class="rule"></div><div class="mini">Production notes</div><ul>${(s.productionNotes||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${button(isBusy("shotbook")?"Menyusun ulang…":"Generate ulang shotbook","makeShotbook()","button primary small",isBusy("shotbook"))}${button("Frame Lab →","setRoute('frame')","button ghost small")}</aside><div><section class="edit-map"><h3>EDIT MAP</h3><p>${esc(s.editStrategy||"Susun transisi berdasarkan perubahan beat, bukan sekadar efek.")}</p><div class="edit-map-grid"><div class="edit-map-box"><b>Sound thread</b><span>${esc(s.audioDirection||"—")}</span></div><div class="edit-map-box"><b>Screen language</b><span>${esc(state.brief.speechMode)} · ${esc(state.brief.ratio)} · ${esc(state.brief.pace)}</span></div></div></section><div class="scene-stack">${s.scenes.map((scene,index)=>sceneCard(scene,index)).join("")}</div></div></div></section>`;
}
function sceneCard(scene,index){
  const hasFrame=Boolean(state.frames[index]);
  return `<article class="scene"><div class="scene-index"><b>${String(index+1).padStart(2,"0")}</b><span>${esc(scene.timecode||"—")}<br>${esc(scene.duration||"—")}</span></div><div class="scene-main"><div class="scene-head"><div><h3>${esc(scene.beat||`Scene ${index+1}`)}</h3><p>${esc(scene.location||"Location to be decided")}</p></div><div class="scene-time">${esc(scene.framing||"SHOT")}</div></div><div class="scene-grid"><div class="scene-block"><div class="mini-label">Action</div><p>${esc(scene.action||"—")}</p></div><div class="scene-block"><div class="mini-label">Camera</div><p>${esc(scene.camera||"—")}</p></div><div class="scene-block"><div class="mini-label">Sound / line</div><p>${esc(scene.sound||"—")}<br>${esc(scene.dialogue||"—")}</p></div><div class="scene-block scene-prompt"><div class="mini-label">Visual prompt</div><p>${esc(scene.visualPrompt||"—")}</p></div></div><div class="scene-footer">${button("Copy prompt",`copyScenePrompt(${index})`,"button ghost small")}${button(hasFrame?"Render ulang frame":"Render keyframe",`renderFrame(${index})`,`button ${hasFrame?"teal":"warm"} small`,isBusy("frame:"+index))}${button("Pilih di Frame Lab",`selectScene(${index})`,"button dark small")}</div></div></article>`;
}

  if(!shotbookReady()) return `<section class="screen active"><div class="page-head"><div><div class="eyebrow">04 / Frame Lab</div><h1>STUDY THE FRAME.</h1><p>Frame Lab baru aktif setelah shotbook selesai agar keyframe mengacu pada adegan yang benar.</p></div></div><div class="empty"><div><div class="empty-icon">◫</div><h3>Belum ada shotbook.</h3><p>Buat shotbook untuk menghasilkan visual prompt per adegan.</p><div style="margin-top:16px">${button("Buka Shotbook →","setRoute('shotbook')","button primary")}</div></div></div></section>`;
  const scene=currentScene();
  const image=state.frames[state.activeSceneIndex];
  const sceneOptions=state.shotbook.scenes.map((s,i)=>`<option value="${i}" ${i===state.activeSceneIndex?"selected":""}>${String(i+1).padStart(2,"0")} — ${esc(s.beat||`Scene ${i+1}`)}</option>`).join("");
  const preview=image
    ? `<img src="${image}" alt="Keyframe scene ${state.activeSceneIndex+1}"><div class="frame-overlay"><span>SC ${String(state.activeSceneIndex+1).padStart(2,"0")} · ${esc(scene?.framing||"FRAME")}</span><span>${esc(scene?.timecode||"00:00:00")}</span></div>`
    : `<div class="frame-empty"><div class="clap">◫</div><h3 style="font-family:'Instrument Serif',serif;font-size:34px;font-weight:400;margin:8px 0">Frame belum dirender.</h3><p style="font-size:11px;line-height:1.6;max-width:420px">Buat keyframe untuk melihat visual direction dari scene yang dipilih. Aset referensi yang Anda upload akan dikirim sebagai bahan visual bila tersedia.</p></div>`;
  const imageActions=image
    ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${button("Download PNG","downloadCurrentFrame()","button primary small")}${button("Buka gambar","openCurrentFrame()","button ghost small")}</div>`
    : "";
  return `<section class="screen active"><div class="page-head"><div><div class="eyebrow">04 / Frame Lab</div><h1>STUDY THE FRAME.</h1><p>Render satu frame referensi untuk mengecek suasana, material, dan bahasa kamera—bukan untuk menghasilkan iklan final dengan teks yang rawan salah eja.</p></div><div class="slate-tag">SCENE ${String(state.activeSceneIndex+1).padStart(2,"0")}<br>${esc(state.brief.ratio)}</div></div><div class="frame-layout"><aside class="frame-controls"><section class="panel"><div class="panel-title"><div><h3>Frame controls</h3><p>Pilih scene yang ingin dipelajari.</p></div><div class="panel-number">04</div></div><div class="field"><label>Scene aktif</label><select onchange="selectScene(Number(this.value))">${sceneOptions}</select></div><div class="divider"></div><div class="guide"><div class="guide-row"><b>Prompt scene</b><span>${esc(scene?.visualPrompt||"—")}</span></div><div class="guide-row"><b>Overlay copy</b><span>${esc(scene?.onScreenText||"Tidak ada text cue")}</span></div><div class="guide-row"><b>Transition</b><span>${esc(scene?.transition||"—")}</span></div></div>${button(isBusy("frame:"+state.activeSceneIndex)?"Merender keyframe…":"Render keyframe",`renderFrame(${state.activeSceneIndex})`,"button warm",isBusy("frame:"+state.activeSceneIndex))}${button("Copy scene prompt",`copyScenePrompt(${state.activeSceneIndex})`,"button ghost small")}</section></aside><div><section class="frame-stage">${preview}</section>${imageActions}<div class="section-head" style="margin-top:24px"><div><div class="eyebrow">Contact sheet</div><h2>FRAMES IN THIS REEL.</h2></div><div class="tag">${frameCount()} rendered</div></div><div class="contact-grid">${contactSheet()}</div></div></div></section>`;
}
function contactSheet(){ const rows=state.shotbook.scenes.map((scene,index)=>{const img=state.frames[index];return `<button class="contact" onclick="selectScene(${index})">${img?`<img src="${img}" alt="Scene ${index+1}">`:`<div style="height:100%;display:grid;place-items:center;color:#8b8377;font:500 10px/1 'DM Mono',monospace">FRAME / —</div>`}<span class="contact-label">SC ${String(index+1).padStart(2,"0")}</span></button>`;}); return rows.join(""); }

function handoverScreen(){
  const has=shotbookReady(); const pack=transferPack(); const build=builderPrompt(); const md=handoverMarkdown();
  return `<section class="screen active"><div class="page-head"><div><div class="eyebrow">05 / Production handover</div><h1>PACK THE REEL.</h1><p>Ambil treatment, shotbook, scene prompts, dan editor notes sebagai satu package. Handover tidak menjanjikan hasil video; ia membuat eksekusi menjadi jelas untuk tool atau tim yang Anda pilih.</p></div><div class="slate-tag">EXPORT<br>${has?"READY":"DRAFT"}</div></div><div class="handover-grid"><div class="handover-block"><h3>Build / production prompt</h3><p>Salin prompt ini ke Gemini Canvas, Flow, Veo workflow, atau berikan sebagai context awal ke editor/creative producer.</p><pre class="codebox">${esc(build)}</pre><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${button("Copy production prompt","copyText(builderPrompt(),'Production prompt tersalin.')","button primary small")}${button("Copy Transfer Pack","copyText(transferPack(),'Transfer Pack tersalin.')","button ghost small")}${button("Download full handover (.md)","downloadMarkdown()","button warm small",!has)}</div></div><aside style="display:grid;gap:13px"><section class="handover-block"><h3>What goes out</h3><div class="handover-list"><div class="handover-line"><b>01 / Treatment</b><br>${has?esc(activeTreatment()?.title||"Selected route"):"Buat dan pilih treatment lebih dulu."}</div><div class="handover-line"><b>02 / Shotbook</b><br>${has?`${state.shotbook.scenes.length} scene dengan camera, action, sound, dan prompt.`:"Belum tersedia."}</div><div class="handover-line"><b>03 / Keyframes</b><br>${frameCount()} keyframe reference yang dapat diunduh.</div><div class="handover-line"><b>04 / Transfer Pack</b><br>Ringkasan brief untuk diteruskan ke Adsprint, Pikat, Rupa, Mula, atau aplikasi Canvas lain.</div></div></section><div class="handover-note"><b>Integrity note</b><br>Adegan menjaga prompt dari testimonial, angka performa, sertifikasi, pricing, atau results claim yang tidak tertulis dalam brief. Tambahkan proof nyata sebelum video diproduksi atau dipublikasikan.</div></aside></div></section>`;
}

function render(){
  let content = state.route==="home"?homeScreen():state.route==="brief"?briefScreen():state.route==="treatment"?treatmentScreen():state.route==="shotbook"?shotbookScreen():state.route==="frame"?frameScreen():handoverScreen();
  document.getElementById("app").innerHTML=shell(content);
}

async function requestModel(model,payload){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
  let delay=900,last;
  for(let attempt=0;attempt<5;attempt++){
    try{
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(res.ok) return await res.json();
      const raw=await res.text(); last=new Error(`HTTP ${res.status}: ${raw.slice(0,260)}`);
      if(res.status!==429 && res.status<500) throw last;
    }catch(err){ last=err; if(attempt===4) break; }
    await new Promise(resolve=>setTimeout(resolve,delay)); delay*=2;
  }
  throw last || new Error("Permintaan Gemini tidak berhasil.");
}
async function requestWithFallback(models,payload){ let last; for(const model of models){try{return await requestModel(model,payload)}catch(err){last=err;console.warn("Model gagal",model,err)}} throw last||new Error("Tidak ada model yang dapat dipakai."); }
function firstText(data){ return (data?.candidates?.[0]?.content?.parts||[]).map(part=>part.text).find(Boolean)||""; }
async function generateJson(prompt,schema){ const data=await requestWithFallback(TEXT_MODELS,{contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",responseSchema:schema}}); const raw=firstText(data); try{return JSON.parse(raw)}catch(err){throw new Error("Output model tidak dapat dibaca sebagai JSON. Coba lagi.");} }
function inlinePart(dataUrl){ if(!/^data:image\//.test(dataUrl||"")) return null; const [meta,data]=dataUrl.split(","); const mime=(meta.match(/^data:([^;]+)/i)||[])[1]||"image/png"; return {inlineData:{data,mimeType:mime}}; }
async function generateImage(prompt,refs=[]){ const parts=[{text:prompt}]; refs.map(inlinePart).filter(Boolean).forEach(part=>parts.push(part)); const data=await requestWithFallback(IMAGE_MODELS,{contents:[{parts}],generationConfig:{responseModalities:["TEXT","IMAGE"]}}); const result=(data?.candidates?.[0]?.content?.parts||[]).find(part=>part.inlineData?.data); if(!result?.inlineData?.data) throw new Error("Model tidak mengembalikan image. Ubah visual language atau coba ulang."); return `data:${result.inlineData.mimeType||"image/png"};base64,${result.inlineData.data}`; }

const TREATMENTS_SCHEMA = {
  type:"OBJECT",
  properties:{
    campaignNorthStar:{type:"STRING"},
    recommendedSequence:{type:"STRING"},
    treatments:{
      type:"ARRAY",
      items:{
        type:"OBJECT",
        properties:{
          title:{type:"STRING"}, logline:{type:"STRING"}, coreIdea:{type:"STRING"}, emotion:{type:"STRING"},
          opening:{type:"STRING"}, closing:{type:"STRING"}, visualWorld:{type:"STRING"}, cameraLanguage:{type:"STRING"},
          soundDirection:{type:"STRING"}, productionScope:{type:"STRING"}, safetyNote:{type:"STRING"}
        },
        required:["title","logline","coreIdea","emotion","opening","closing","visualWorld","cameraLanguage","soundDirection","productionScope","safetyNote"]
      }
    }
  },
  required:["campaignNorthStar","recommendedSequence","treatments"]
};
const SHOTBOOK_SCHEMA = {
  type:"OBJECT",
  properties:{
    masterDirection:{type:"STRING"}, totalDuration:{type:"STRING"}, editStrategy:{type:"STRING"}, audioDirection:{type:"STRING"},
    productionNotes:{type:"ARRAY",items:{type:"STRING"}},
    scenes:{
      type:"ARRAY",
      items:{
        type:"OBJECT",
        properties:{
          sceneNumber:{type:"INTEGER"}, timecode:{type:"STRING"}, duration:{type:"STRING"}, beat:{type:"STRING"},
          location:{type:"STRING"}, framing:{type:"STRING"}, action:{type:"STRING"}, camera:{type:"STRING"},
          dialogue:{type:"STRING"}, sound:{type:"STRING"}, onScreenText:{type:"STRING"}, transition:{type:"STRING"}, visualPrompt:{type:"STRING"}
        },
        required:["sceneNumber","timecode","duration","beat","location","framing","action","camera","dialogue","sound","onScreenText","transition","visualPrompt"]
      }
    }
  },
  required:["masterDirection","totalDuration","editStrategy","audioDirection","productionNotes","scenes"]
};

function briefContext(){ const b=state.brief; return `Brand: ${b.brandName}\nProject: ${b.projectTitle||"—"}\nProduk/jasa: ${b.product}\nKategori: ${b.category}\nAudiens: ${b.audience}\nTujuan video: ${b.objective}\nPesan utama: ${b.message}\nProof yang tersedia: ${b.proof||"belum ada"}\nCTA: ${b.cta}\nTipe video: ${b.videoType}\nPlatform: ${b.platform}\nRasio: ${b.ratio}\nDurasi: ${b.duration}\nPace: ${b.pace}\nMode suara: ${b.speechMode}\nVisual language: ${b.visualLanguage}\nMood: ${b.mood}\nReferensi: ${b.references||"—"}\nGuardrails: ${b.guardrails||"—"}\nTransfer Pack: ${b.transferPack||"—"}\nCatatan: ${b.notes||"—"}`; }
async function withLoading(key,fn){ state.loading[key]=true; render(); try{await fn();persist();notify("Output baru sudah siap.");}catch(err){console.error(err);notify(err?.message||"Terjadi kendala saat memproses.","error");}finally{delete state.loading[key];render();} }
async function makeTreatments(){ await withLoading("treatments",async()=>{ if(!briefReady()) throw new Error("Lengkapi minimal Nama Brand, Produk/Jasa, Audiens, Pesan Utama, dan CTA."); const prompt=`Anda adalah sutradara iklan dan creative director berpengalaman untuk brand Indonesia. Buat TEPAT tiga director's treatment berbeda untuk brief berikut.\n\n${briefContext()}\n\nSetiap route harus benar-benar berbeda secara storytelling dan bahasa visual. Treatment harus layak diproduksi untuk format ${state.brief.ratio} berdurasi ${state.brief.duration} pada ${state.brief.platform}. Gunakan Bahasa Indonesia yang natural. Jangan membuat testimoni, metrik performa, sertifikasi, hasil penggunaan, diskon, atau klaim yang tidak ada di brief. Jika proof belum tersedia, safetyNote harus menyebutkan footage atau proof yang perlu disiapkan. Jangan tulis naskah scene sekarang—ini adalah treatment tingkat director. Return JSON sesuai schema.`; const result=await generateJson(prompt,TREATMENTS_SCHEMA); if(!Array.isArray(result.treatments)||result.treatments.length<3) throw new Error("Tiga treatment tidak terbentuk. Coba perjelas brief."); state.treatments={...result,treatments:result.treatments.slice(0,3)};state.activeTreatmentIndex=0;state.shotbook=null;state.frames={};state.activeSceneIndex=0;state.route="treatment"; }); }
function selectTreatment(index){ state.activeTreatmentIndex=index;state.shotbook=null;state.frames={};state.activeSceneIndex=0;persist();render();notify("Treatment aktif dipilih. Buat Shotbook untuk melanjutkan."); }
async function makeShotbook(){ await withLoading("shotbook",async()=>{ if(!treatmentReady()) throw new Error("Pilih treatment terlebih dahulu."); const t=activeTreatment(); const sceneTarget=state.brief.duration==="15 detik"?5:state.brief.duration==="30 detik"?7:state.brief.duration==="45 detik"?8:state.brief.duration==="60 detik"?10:12; const prompt=`Anda adalah director, DP, dan editor untuk video campaign Indonesia. Ubah director's treatment berikut menjadi shotbook produksi yang operasional.\n\nBRIEF:\n${briefContext()}\n\nTREATMENT AKTIF:\nJudul: ${t.title}\nLogline: ${t.logline}\nCore idea: ${t.coreIdea}\nEmotion: ${t.emotion}\nOpening: ${t.opening}\nClosing: ${t.closing}\nVisual world: ${t.visualWorld}\nCamera language: ${t.cameraLanguage}\nSound direction: ${t.soundDirection}\nProduction scope: ${t.productionScope}\nSafety note: ${t.safetyNote}\n\nBuat tepat ${sceneTarget} scene dengan total durasi sekitar ${state.brief.duration}. Setiap visualPrompt wajib berbahasa Inggris, eksplisit, realistis, dan siap dipakai sebagai referensi image/video generation. Visual prompt harus memuat subject, action, lighting, environment, lens/camera intent, texture, and aspect ratio ${state.brief.ratio}. Jangan meminta model menulis teks promosi kecil di dalam visual; onScreenText harus menjadi catatan overlay terpisah yang singkat. Jangan menciptakan endorsement, rating, manfaat tanpa proof, atau klaim yang tidak ada dalam brief. Return JSON sesuai schema.`; const result=await generateJson(prompt,SHOTBOOK_SCHEMA); if(!Array.isArray(result.scenes)||!result.scenes.length) throw new Error("Shotbook belum terbentuk. Coba generate ulang."); state.shotbook=result;state.frames={};state.activeSceneIndex=0;state.route="shotbook"; }); }
function selectScene(index){ state.activeSceneIndex=index;persist();render(); if(state.route!=="frame") setRoute("frame"); }
async function renderFrame(index){ await withLoading("frame:"+index,async()=>{ if(!shotbookReady()) throw new Error("Shotbook belum tersedia."); const scene=state.shotbook.scenes[index]; const refs=state.asset.data?[state.asset.data]:[]; const prompt=`Create a single cinematic storyboard keyframe for a brand campaign. This is a VISUAL REFERENCE ONLY, not a finished ad. Follow this scene direction precisely:\n${scene.visualPrompt}\n\nBrand/project context: ${state.brief.brandName} — ${state.brief.product}. Mood: ${state.brief.mood}. Visual language: ${state.brief.visualLanguage}. Camera intent: ${scene.camera}. Framing: ${scene.framing}. Aspect ratio: ${state.brief.ratio}.\n\nIf an uploaded product or object reference is attached, preserve its recognizable shape, packaging, logo placement, and primary color as closely as possible, without inventing a competing product. Do not add readable promotional text, price tags, logos, watermarks, made-up reviews, medical claims, or tiny typography. Leave intentional negative space where an editor can later add approved overlay copy. Cinematic, realistic lighting, production design, clean composition.`; const image=await generateImage(prompt,refs);state.frames[index]=image;state.activeSceneIndex=index;state.route="frame"; }); }
function copyScenePrompt(index){ const scene=state.shotbook?.scenes?.[index]; if(!scene) return; copyText(scene.visualPrompt||"","Prompt scene tersalin."); }
function copyText(text,message="Tersalin."){ if(!text) return notify("Belum ada konten untuk disalin.","error"); navigator.clipboard?.writeText(text).then(()=>notify(message)).catch(()=>{ const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();notify(message); }); }
function transferPack(){ const b=state.brief,t=activeTreatment(),s=state.shotbook; return `[CANVAS-BRIEF v1]\nSource: ADEGAN — Director's Treatment Lab\nBrand: ${b.brandName||"—"}\nProject: ${b.projectTitle||"—"}\nProduct / offer: ${b.product||"—"}\nAudience: ${b.audience||"—"}\nVideo objective: ${b.objective||"—"}\nCore message: ${b.message||"—"}\nProof available: ${b.proof||"—"}\nCTA: ${b.cta||"—"}\nFormat: ${b.videoType||"—"} · ${b.platform||"—"} · ${b.ratio||"—"} · ${b.duration||"—"}\nVisual language: ${b.visualLanguage||"—"}\nMood: ${b.mood||"—"}\nSelected treatment: ${t?.title||"—"}\nTreatment logline: ${t?.logline||"—"}\nShotbook: ${s?.scenes?.length||0} scenes\nGuardrails: ${b.guardrails||"Do not fabricate proof, testimonials, results, certification, metrics, pricing, or urgency."}\n`; }
function builderPrompt(){ const t=activeTreatment(),s=state.shotbook; if(!t||!s) return `Buat sebuah video campaign berdasarkan brief berikut. Mulai dengan melengkapi Project Brief dan Shotbook di ADEGAN agar prompt produksi menjadi spesifik.\n\n${transferPack()}`; return `You are a senior creative producer and video director. Build a production-ready campaign video using the approved director's treatment and shotbook below. Keep every factual claim grounded only in the brief. Do not invent reviews, results, certifications, pricing, urgency, testimonials, medical claims, or brand partnerships.\n\n${transferPack()}\nDIRECTOR'S TREATMENT\nTitle: ${t.title}\nLogline: ${t.logline}\nCore idea: ${t.coreIdea}\nVisual world: ${t.visualWorld}\nCamera language: ${t.cameraLanguage}\nSound direction: ${t.soundDirection}\nOpening: ${t.opening}\nClosing: ${t.closing}\n\nSHOTBOOK\n${s.scenes.map((scene,i)=>`SCENE ${String(i+1).padStart(2,"0")} | ${scene.timecode} | ${scene.duration}\nBeat: ${scene.beat}\nAction: ${scene.action}\nCamera: ${scene.camera}\nFraming: ${scene.framing}\nDialogue: ${scene.dialogue}\nSound: ${scene.sound}\nOn-screen overlay spec: ${scene.onScreenText}\nTransition: ${scene.transition}\nVisual prompt: ${scene.visualPrompt}`).join("\n\n")}\n\nOUTPUT RULES\n- Respect the requested aspect ratio and duration.\n- Preserve product/object form from any attached reference image.\n- Keep on-screen text as editable overlays; do not bake small promotional text into imagery.\n- Return an execution plan with scene order, visual direction, audio cues, edit notes, and production checklist.`; }
function handoverMarkdown(){ const b=state.brief,t=activeTreatment(),s=state.shotbook; if(!t||!s) return `# ADEGAN — Director's Treatment Draft\n\nLengkapi Project Brief, pilih Treatment, lalu generate Shotbook terlebih dahulu.\n\n${transferPack()}`; return `# ${b.brandName || "Untitled"} — ${b.projectTitle || "Director's Treatment"}\n\n## Project brief\n- Product / offer: ${b.product}\n- Audience: ${b.audience}\n- Objective: ${b.objective}\n- Core message: ${b.message}\n- Proof available: ${b.proof || "—"}\n- CTA: ${b.cta}\n- Video format: ${b.videoType} · ${b.platform} · ${b.ratio} · ${b.duration}\n- Pace: ${b.pace}\n- Sound mode: ${b.speechMode}\n- Visual language: ${b.visualLanguage}\n- Mood: ${b.mood}\n- Guardrails: ${b.guardrails || "—"}\n\n## Selected treatment — ${t.title}\n${t.logline}\n\n### Core idea\n${t.coreIdea}\n\n### Emotion\n${t.emotion}\n\n### Opening / Closing\n${t.opening}\n\n${t.closing}\n\n### Visual world\n${t.visualWorld}\n\n### Camera language\n${t.cameraLanguage}\n\n### Sound direction\n${t.soundDirection}\n\n### Production scope\n${t.productionScope}\n\n### Safety note\n${t.safetyNote}\n\n## Shotbook\nMaster direction: ${s.masterDirection}\n\nEdit strategy: ${s.editStrategy}\n\nAudio direction: ${s.audioDirection}\n\n### Production notes\n${(s.productionNotes||[]).map(x=>`- ${x}`).join("\n")}\n\n${s.scenes.map((scene,i)=>`### Scene ${String(i+1).padStart(2,"0")} — ${scene.timecode} (${scene.duration})\n**Beat:** ${scene.beat}\n**Location:** ${scene.location}\n**Framing:** ${scene.framing}\n**Action:** ${scene.action}\n**Camera:** ${scene.camera}\n**Dialogue:** ${scene.dialogue}\n**Sound:** ${scene.sound}\n**On-screen overlay:** ${scene.onScreenText}\n**Transition:** ${scene.transition}\n**Visual prompt:** ${scene.visualPrompt}`).join("\n\n")}\n\n## Canvas Transfer Pack\n${transferPack()}\n\n## Production prompt\n${builderPrompt()}\n`; }
function downloadMarkdown(){ const blob=new Blob([handoverMarkdown()],{type:"text/markdown;charset=utf-8"}); const url=URL.createObjectURL(blob); const a=document.createElement("a");a.href=url;a.download=`adegan-${(state.brief.brandName||"project").toLowerCase().replace(/[^a-z0-9]+/g,"-")}-handover.md`;a.click();URL.revokeObjectURL(url);notify("Handover Markdown diunduh."); }
function downloadDataUrl(dataUrl,filename){ const a=document.createElement("a");a.href=dataUrl;a.download=filename;a.click();notify("Keyframe PNG diunduh."); }
function downloadCurrentFrame(){ const image=state.frames[state.activeSceneIndex]; if(!image) return notify("Belum ada keyframe untuk diunduh.","error"); downloadDataUrl(image,`adegan-scene-${state.activeSceneIndex+1}.png`); }
function openFrame(dataUrl){ const win=window.open(); if(win){win.document.write(`<img src="${dataUrl}" style="max-width:100%;height:auto;background:#111">`);win.document.title="ADEGAN keyframe";} }
function openCurrentFrame(){ const image=state.frames[state.activeSceneIndex]; if(!image) return notify("Belum ada keyframe untuk dibuka.","error"); openFrame(image); }
function onUpload(input){ const file=input.files?.[0]; if(!file) return; if(!file.type.startsWith("image/")) return notify("Pilih file gambar PNG, JPG, atau WEBP.","error"); if(file.size>8*1024*1024) return notify("Ukuran gambar maksimal 8MB.","error"); const reader=new FileReader(); reader.onload=()=>{state.asset={data:reader.result,name:file.name};render();notify("Foto referensi siap digunakan.");}; reader.readAsDataURL(file); }
function loadDemo(){ state.brief={...defaultBrief,brandName:"Sora Brew",projectTitle:"First Light",product:"Cold brew oat latte siap minum",category:"F&B",audience:"Pekerja kreatif usia 22–34 yang ingin ritual pagi lebih tenang",objective:"Awareness + consideration",message:"Pagi yang lebih pelan bisa dimulai dari satu kopi yang sudah siap menemani.",proof:"Foto produk asli, 3 varian rasa, proses cold brew 16 jam yang dapat ditunjukkan melalui footage.",cta:"Lihat varian dan titik pesan",videoType:"Product film",platform:"Instagram / TikTok",ratio:"9:16",duration:"30 detik",pace:"Terukur & sinematik",speechMode:"Voice-over ringan",visualLanguage:"Cinematic tactile",mood:"Hangat & percaya diri",references:"Golden morning light, kitchen counter, condensation on bottle, tactile hands, steam, urban apartment.",guardrails:"Jangan membuat klaim paling sehat atau menyebut manfaat medis. Jangan buat rating, review, atau diskon palsu.",notes:"Produk utama harus terlihat jelas tanpa logo pesaing."};state.treatments=null;state.shotbook=null;state.frames={};state.activeTreatmentIndex=0;state.activeSceneIndex=0;state.route="brief";persist();render();notify("Demo brief dimuat. Buat 3 treatment untuk melanjutkan."); }

loadState();render();
