<body>
  <div class="shell">
    <header class="mast">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-copy"><b>MIMIK</b><span>Persona Continuity Studio</span></div>
      </div>

        <div class="pulse"><i></i> Sesi lokal</div>
        <button class="button paper small" data-action="demo">Muat demo</button>
        <button class="button ghost small" data-action="clear">Reset</button>
      </div>
    </header>
    <nav class="folio" id="folio"></nav>
    <main id="app"></main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal" data-action="close-modal"><div class="modal-card" onclick="event.stopPropagation()"><img id="modalImage" alt="Pratinjau persona"/><div class="modal-tools"><button class="button paper small" data-action="download-modal">Unduh PNG</button><button class="button dark small" data-action="close-modal">Tutup</button></div></div></div>
<script>
const apiKey = "";
const TEXT_MODELS = ["gemini-2.5-flash", "gemini-2.0-flash"];
const IMAGE_MODELS = ["gemini-2.5-flash-image-preview"];
const STORE_KEY = "mimik-persona-continuity-v1";
const routes = [
  ["studio","01","Studio"], 
  ["identity","02","File Identitas"], 
  ["bible","03","Persona Bible"], 
  ["lookbook","04","Lookbook"], 
  ["handover","05","Handover"]
];
const defaultBrief = {
  personaName:"", track:"Talent brand fiktif", brand:"", role:"", audience:"", visualGoal:"",
  description:"", personality:"", facialAnchors:"", hairFeatures:"", wardrobe:"", environment:"", style:"Potret editorial", ratio:"4:5", guardrails:"", transfer:""
};
const defaultState = { route:"studio", brief:{...defaultBrief}, blueprint:null, selectedLook:0, files:{portrait:null, wardrobe:null}, images:{}, loading:{} };
let state = loadState();
let activeModalImage = null;

function loadState(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if(!raw) return structuredClone(defaultState);
    return {...structuredClone(defaultState), ...raw, brief:{...defaultBrief,...(raw.brief||{})}, files:{portrait:null,wardrobe:null},images:{},loading:{}};
  }catch(e){ return structuredClone(defaultState); }
}

function persist(){
  const safe = {route:state.route,brief:state.brief,blueprint:state.blueprint,selectedLook:state.selectedLook};
  localStorage.setItem(STORE_KEY, JSON.stringify(safe));
}

function resetAll(){ 
  localStorage.removeItem(STORE_KEY); 
  state=structuredClone(defaultState); 
  render(); 
  toast("Workspace direset."); 
}

function esc(v){
  return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
}

function slug(v){
  return String(v||"mimik").toLowerCase().trim().replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"")||"mimik";
}

function val(v,fallback="—"){
  return v&&String(v).trim()?String(v).trim():fallback;
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>el.classList.remove("show"),3300);
}

function isLoading(k){return !!state.loading[k];}
function setLoading(k,v){state.loading[k]=v;render();}
function go(route){state.route=route;persist();render();window.scrollTo({top:0,behavior:"smooth"});}

function nav(){
  const idx=Math.max(0,routes.findIndex(r=>r[0]===state.route));
  return routes.map(([id,no,label])=>`<button class="folio-btn ${state.route===id?"active":""}" data-route="${id}"><span>${no}</span>${label}</button>`).join("")+`<div class="folio-meta">Folio ${String(idx+1).padStart(2,"0")}/05</div>`;
}

function button(label, action, variant="paper", disabled=false, small=false){
  return `<button class="button ${variant} ${small?"small":""}" data-action="${action}" ${disabled?"disabled":""}>${label}</button>`;
}

function render(){
  document.getElementById("folio").innerHTML=nav();
  const app=document.getElementById("app");
  app.innerHTML=state.route==="studio"?studio():state.route==="identity"?identity():state.route==="bible"?bible():state.route==="lookbook"?lookbook():handover();
}

    <article class="panel tint-red">

      <h3>Lab Lookbook</h3>

      ${button(bp?"Buka lookbook":"Menunggu blueprint","go:lookbook","paper",!bp,true)}
    </article>
  </div>
 </section>`;
}

function inputField(label,key,placeholder,opts={}){
  const t=opts.type||"text";
  const v=esc(state.brief[key]||"");
  return `<div class="field ${opts.full?"full":""}"><label>${label}${opts.required?" <i>*</i>":""}</label>${t==="textarea"?`<textarea data-field="${key}" placeholder="${esc(placeholder)}">${v}</textarea>`:`<input data-field="${key}" type="${t}" value="${v}" placeholder="${esc(placeholder)}"/>`}${opts.note?`<small>${opts.note}</small>`:""}</div>`;
}

function selectField(label,key,items,opts={}){
  return `<div class="field ${opts.full?"full":""}"><label>${label}${opts.required?" <i>*</i>":""}</label><select data-field="${key}">${items.map(x=>`<option ${state.brief[key]===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`;
}

function upload(label,key,description){
  const img=state.files[key];
  return `<div class="upload"><div class="upload-preview">${img?`<img src="${img}" alt="Referensi"/>`:key==="portrait"?"◉":"▧"}</div><div><b>${label}</b><span>${description}</span></div><label class="button paper small">${img?"Ganti":"Pilih foto"}<input type="file" accept="image/png,image/jpeg,image/webp" data-upload="${key}"/></label></div>`;
}

function fileToData(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

async function handleUpload(input){

  try{
    state.files[key]=await fileToData(file);
    render();
    toast("Referensi dilampirkan untuk sesi ini.");
  }catch(e){toast("Gagal membaca file.");}
}

function cleanJson(raw) {
  let text = String(raw || "").trim();
  text = text.replace(/^\x60{3}(?:json)?/i, "").replace(/\x60{3}$/i, "").trim();
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  return (start >= 0 && end >= start) ? text.slice(start, end + 1) : text;
}

function getText(data){
  return (data?.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("\n").trim();
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function gemini(model,payload){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
  let last;
  for(let attempt=0;attempt<3;attempt++){
    try{
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const data=await res.json();
      if(!res.ok)throw new Error(data?.error?.message||`Request failed (${res.status})`);
      return data;
    }catch(err){
      last=err;
      await sleep(650*(attempt+1));
    }
  }
  throw last||new Error("Permintaan Gemini API gagal");
}

async function generateJson(prompt){
  let last;
  for(const model of TEXT_MODELS){
    try{
      const data=await gemini(model,{contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{temperature:.72,responseMimeType:"application/json"}});
      const raw=getText(data);
      return JSON.parse(cleanJson(raw));
    }catch(e){last=e;}
  }
  throw last||new Error("Tidak dapat menghasilkan respons terstruktur");
}

function dataUrlPart(dataUrl){
  if(!dataUrl||!dataUrl.startsWith("data:image"))return null;
  const [meta,data]=dataUrl.split(",");
  const mime=(meta.match(/^data:([^;]+)/)||[])[1]||"image/png";
  return {inlineData:{mimeType:mime,data}};
}

async function generateImage(prompt){
  let last;
  for(const model of IMAGE_MODELS){
    try{
      const parts=[{text:prompt}];
      const portrait=dataUrlPart(state.files.portrait),wardrobe=dataUrlPart(state.files.wardrobe);
      if(portrait)parts.push(portrait);
      if(wardrobe)parts.push(wardrobe);
      const data=await gemini(model,{contents:[{role:"user",parts}],generationConfig:{responseModalities:["TEXT","IMAGE"]}});
      const part=(data?.candidates?.[0]?.content?.parts||[]).find(p=>p.inlineData?.data);
      if(!part?.inlineData?.data)throw new Error("Model gambar tidak mengembalikan gambar.");
      return `data:${part.inlineData.mimeType||"image/png"};base64,${part.inlineData.data}`;
    }catch(e){last=e;}
  }
  throw last||new Error("Render gambar gagal");
}

async function createBible(){
  const b=state.brief;
  if(!b.personaName.trim()||!b.description.trim()){toast("Isi nama persona dan deskripsi dasar terlebih dahulu.");return;}
  setLoading("blueprint",true);
  try{
    const prompt=`You are a senior creative director and casting editor for brand visual systems. Build a safe, practical Persona Bible in Indonesian from the following brief. The user may be using a fictional persona, a licensed talent, or a person with consent. Never identify a person, never describe a public figure, never suggest impersonation, and never make factual claims not supplied. This is creative direction only.

BRIEF
${transferPack()}

Return JSON only with this exact high-level schema:
{
  "documentCode":"MIMIK-...",
  "title":"...",
  "personaName":"...",
  "oneSentence":"...",
  "safetyNote":"...",
  "visualDNA":{"presence":"...","agePresentation":"...","facialAnchors":"...","hairFeatures":"...","styling":"...","environment":"..."},
  "personalityDirection":"...",
  "expressionDirection":"...",
  "consistencyLock":{"coreAnchors":"...","wardrobeSystem":"...","lightingLanguage":"...","cameraLanguage":"...","avoidDrift":"..."},
  "doNotDrift":["...","...","..."],
  "lookbook":[
    {"id":"look-1","title":"...","objective":"...","mood":"...","wardrobe":"...","environment":"...","poseExpression":"...","framing":"...","palette":"...","renderPrompt":"..."}
  ]
}
Generate exactly 6 distinct but coherent lookbook concepts. renderPrompt must be complete, standalone, English, and should describe a tasteful editorial image. It must include: fictional/consented talent direction, expression, wardrobe, environment, camera framing, lighting, ratio ${b.ratio}, and the words "no watermark, no unrelated readable text". Do not bake ad copy or fake claims into images.`;
    
    const out=await generateJson(prompt);
    if(!Array.isArray(out.lookbook))out.lookbook=[];
    out.lookbook=out.lookbook.slice(0,6).map((x,i)=>({...x,id:x.id||`look-${i+1}`}));
    state.blueprint=out;
    state.selectedLook=0;
    persist();
    toast("Persona Bible selesai dibuat.");
    go("bible");
  }catch(e){
    console.error(e);
    toast(`Gagal membuat Persona Bible: ${e.message||"coba lagi"}`);
  }finally{
    state.loading["blueprint"]=false;
  }
}

function copy(text,msg="Tersalin ke clipboard."){
  navigator.clipboard?.writeText(text).then(()=>toast(msg)).catch(()=>{
    const ta=document.createElement("textarea");
    ta.value=text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast(msg);
  });
}

function download(filename,content,mime="text/markdown;charset=utf-8"){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),250);
}

function downloadImage(filename,data){
  const a=document.createElement("a");
  a.href=data;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

  const bp=state.blueprint||{};

}

function action(action){
  if(!action)return;
  if(action.startsWith("go:"))return go(action.slice(3));
  if(action==="demo")return loadDemo();
  if(action==="clear")return resetAll();
  if(action==="generate-blueprint")return createBible();
  if(action==="copy-summary")return copy(`${state.blueprint?.oneSentence||""}\n\n${JSON.stringify(state.blueprint?.visualDNA||{},null,2)}`,"Ringkasan persona tersalin.");
  if(action.startsWith("select-look:")){state.selectedLook=Number(action.split(":")[1])||0;persist();return render();}
  if(action.startsWith("render:"))return renderLook(action.slice(7));
  if(action.startsWith("copy-look:")){const look=looks().find(x=>x.id===action.slice(10));return copy(look?.renderPrompt||"","Prompt look tersalin.");}
  if(action.startsWith("download:")){
    const id=action.slice(9);
    const image=state.images[id];
    const look=looks().find(x=>x.id===id);
    return image?downloadImage(`${slug(state.brief.personaName)}-${slug(look?.title)}.png`,image):null;
  }
  if(action.startsWith("view:")){
    const id=action.slice(5);
    activeModalImage=state.images[id];
    if(activeModalImage){
      document.getElementById("modalImage").src=activeModalImage;
      document.getElementById("modal").classList.add("show");
    }
    return;
  }
  if(action==="close-modal"){document.getElementById("modal").classList.remove("show");return;}
  if(action==="download-modal"&&activeModalImage)return downloadImage(`${slug(state.brief.personaName)}-mimik-frame.png`,activeModalImage);
  if(action==="copy-transfer")return copy(transferPack(),"Canvas Transfer Pack tersalin.");
  if(action==="copy-production")return copy(productionPrompt(),"Prompt Produksi tersalin.");
  if(action==="download-pack")return download(`${slug(state.brief.personaName)}-canvas-transfer-pack.md`,transferPack());
  if(action==="export-dossier")return download(`${slug(state.brief.personaName)}-mimik-persona-dossier.md`,dossier());
}

document.addEventListener("click",e=>{
  const route=e.target.closest("[data-route]");
  if(route){go(route.dataset.route);return;}
  const el=e.target.closest("[data-action]");
